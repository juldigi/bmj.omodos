name: OMODOS safe Patrol and login replay QA
on:
  push:
    branches:
      - fix/omodos-safe-patrol-replay-20261113
    paths:
      - "src/worker.js"
      - "public/index.html"
      - "public/omodos4/patrol-area-feedback.js"
      - "public/omodos4/patrol-review-enhancements.js"
      - "tools/test_omodos_safe_replay.cjs"
      - ".github/workflows/omodos-safe-replay-qa.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax validation
        run: |
          node --check src/worker.js
          node --check public/omodos4/patrol-area-feedback.js
          node --check public/omodos4/patrol-review-enhancements.js
          node --check public/omodos4/technical-performance.js
      - name: Targeted regressions
        run: |
          node tools/test_omodos_safe_replay.cjs
          node tools/test_patrol_revisions.cjs
          node tools/test_logbook_downtime_choice.cjs
          node tools/test_logbook_review_fixes.cjs
          node tools/test_technical_performance_odin.cjs
          node tools/test_technical_performance_source_truth.cjs
          node tools/test_factory_home_card_detail.cjs
          node tools/test_smart_resume.cjs
          node tools/test_training_findings.cjs
          node tools/test_work_areas.cjs
      - name: Whitespace validation
        run: git diff --check
