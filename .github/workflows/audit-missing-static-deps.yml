name: Audit Missing Static Dependencies

on:
  push:
    branches:
      - recovery/cloudflare-version-safe
    paths:
      - ".github/workflows/audit-missing-static-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect references and global usage
        shell: python
        run: |
          from pathlib import Path
          import re

          src=Path("public/index.html").read_text(encoding="utf-8",errors="replace")
          lines=src.splitlines()

          refs=[
            "omodos4/omodos4.css",
            "omodos4/bootstrap.js",
            "vendor/jspdf.min.js",
            "vendor/docx.min.js",
            "vendor/xlsx.min.js",
            "vendor/vis-network.min.js",
            "vendor/html2canvas.min.js",
            "vendor/exceljs.min.js",
            "vendor/chart.min.js",
          ]

          globals={
            "jsPDF":["jspdf","jsPDF"],
            "docx":["docx"],
            "XLSX":["XLSX"],
            "vis":["vis.Network","vis.DataSet","new vis."],
            "html2canvas":["html2canvas"],
            "ExcelJS":["ExcelJS"],
            "Chart":["new Chart(","Chart.getChart","window.Chart"],
          }

          out=["# Missing Static Dependencies Audit",""]

          out+=["## Resource references",""]
          for ref in refs:
            hits=[i for i,l in enumerate(lines,1) if ref in l]
            out.append(f"### {ref} — {len(hits)} hit(s)")
            for i in hits:
              start=max(1,i-3); end=min(len(lines),i+3)
              out.append("~~~text")
              for n in range(start,end+1):
                line=lines[n-1].strip()
                if len(line)>500: line=line[:500]+"…"
                out.append(f"{n:05d}: {line}")
              out.append("~~~")
            out.append("")

          out+=["## Global/library usage",""]
          for name,terms in globals.items():
            hits=[]
            for i,l in enumerate(lines,1):
              if any(t in l for t in terms):
                hits.append((i,l.strip()))
            out.append(f"### {name} — {len(hits)} matching line(s)")
            for i,line in hits[:40]:
              if len(line)>700: line=line[:700]+"…"
              out.append(f"- L{i}: {line}")
            out.append("")

          # Existing CDN URLs mentioning any dependency name.
          urls=sorted(set(re.findall(r'https?://[^"\'\s<>]+',src)))
          dep_urls=[u for u in urls if any(k in u.lower() for k in (
            "jspdf","docx","xlsx","sheetjs","vis-network","html2canvas","exceljs","chart"
          ))]
          out+=["## Existing dependency CDN URLs",""]
          if dep_urls:
            out += [f"- {u}" for u in dep_urls[:100]]
          else:
            out.append("- None found.")
          out.append("")

          Path("audit").mkdir(exist_ok=True)
          Path("audit/MISSING_STATIC_DEPENDENCIES.md").write_text("\n".join(out)+"\n",encoding="utf-8")

      - name: Commit audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/MISSING_STATIC_DEPENDENCIES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: inspect missing production static dependencies"
          git push
