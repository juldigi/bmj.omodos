name: Probe Cloudflare OMODOS Backend Recovery

on:
  push:
    branches:
      - recovery/omodos4-phase1-safe
    paths:
      - ".github/workflows/probe-cloudflare-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Probe Worker source availability without exposing source
        shell: python
        run: |
          import os, sys, json, hashlib, urllib.request, urllib.error

          token=os.environ.get("CLOUDFLARE_API_TOKEN","").strip()
          status={
            "token_present": bool(token),
            "target_worker": "omodos",
            "worker_found": False,
            "source_readable": False
          }

          if not token:
            print("[CF_PROBE] "+json.dumps(status))
            print("CLOUDFLARE_API_TOKEN is not configured in this GitHub repository.")
            sys.exit(0)

          def get_json(url):
            req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/json"
            })
            with urllib.request.urlopen(req,timeout=20) as r:
              return json.loads(r.read().decode("utf-8"))

          def get_raw(url):
            req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+token,
              "Accept":"*/*"
            })
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read()
              return body, r.headers.get("Content-Type","")

          try:
            accounts=get_json("https://api.cloudflare.com/client/v4/accounts?per_page=50")
            account_rows=accounts.get("result") or []
            status["accessible_accounts"]=len(account_rows)
          except Exception as e:
            status["account_discovery_error"]=type(e).__name__
            print("[CF_PROBE] "+json.dumps(status))
            sys.exit(0)

          target_account=None
          script_meta=None
          for account in account_rows:
            account_id=account.get("id")
            if not account_id:
              continue
            try:
              scripts=get_json(f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts")
              for item in scripts.get("result") or []:
                if str(item.get("id") or "")=="omodos":
                  target_account=account_id
                  script_meta=item
                  break
            except Exception:
              continue
            if target_account:
              break

          if not target_account:
            print("[CF_PROBE] "+json.dumps(status))
            sys.exit(0)

          status["worker_found"]=True
          if script_meta:
            status["compatibility_date"]=script_meta.get("compatibility_date")
            status["has_placement"]=bool(script_meta.get("placement"))

          try:
            raw,content_type=get_raw(
              f"https://api.cloudflare.com/client/v4/accounts/{target_account}/workers/scripts/omodos/content/v2"
            )
            status["source_readable"]=True
            status["source_bytes"]=len(raw)
            status["source_sha256"]=hashlib.sha256(raw).hexdigest()
            status["content_type_family"]=(content_type.split(";")[0] if content_type else "")
            low=raw.lower()
            # Boolean-only architecture fingerprint. No source text is printed.
            markers={
              "durable_object": b"durable" in low and b"object" in low,
              "sqlite": b"sqlite" in low,
              "maintenance_store": b"maintenancestore" in low,
              "session": b"session" in low,
              "rbac": b"rbac" in low or b"permission" in low,
              "omodos4": b"omodos4" in low,
            }
            status["markers"]=markers
          except Exception as e:
            status["source_read_error"]=type(e).__name__

          print("[CF_PROBE] "+json.dumps(status,sort_keys=True))
