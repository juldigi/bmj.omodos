name: Apply Copilot Bantuan Fix

on:
  push:
    branches:
      - fix/bantuan-copilot
    paths:
      - "tools/patch_copilot_bantuan.py"
      - ".github/workflows/apply-copilot-bantuan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_copilot_bantuan.py

      - name: Validate invariants
        shell: python
        run: |
          from pathlib import Path
          s=Path("public/index.html").read_text(encoding="utf-8")
          checks={
            "help_button_inside_copilot": 'id="copilot-help"' in s,
            "help_renderer": "function copilotOpenHelp_()" in s,
            "page_guide_hidden": ".legacy-simple-guide{display:none!important}" in s,
            "page_guide_injector_removed": "top.insertAdjacentElement('afterend',guide)" not in s,
            "guide_data_reused": "window.OMODOS_HELP_DATA" in s,
            "clear_data_preserved": "copilotClearData_();" in s,
            "copilot_internal_preserved": "copilotAskInternal_" in s,
            "copilot_external_preserved": "copilotAskExternal_" in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit("Bantuan safety checks failed: "+", ".join(bad))

      - name: Validate new JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("public/index.html").read_text(encoding="utf-8")
          # Extract the main application script containing Copilot handlers.
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          candidates=[x for x in scripts if 'function copilotOpenHelp_' in x]
          if len(candidates)!=1:
              raise SystemExit(f"Expected one Copilot help script, got {len(candidates)}")
          Path("/tmp/copilot-help-main.js").write_text(candidates[0],encoding="utf-8")
          PY
          node --check /tmp/copilot-help-main.js

      - name: Commit patched frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: move Bantuan cards into Copilot"
          git push
