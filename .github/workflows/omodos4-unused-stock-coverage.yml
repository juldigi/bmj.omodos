name: OMODOS4 Sparepart Usage Coverage QA

on:
  push:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'public/omodos4/superadmin-intelligence.js'
      - 'tools/test_omodos4_unused_stock_coverage.cjs'
      - '.github/workflows/omodos4-unused-stock-coverage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/worker.js'
      - 'public/omodos4/superadmin-intelligence.js'
      - 'tools/test_omodos4_unused_stock_coverage.cjs'
      - '.github/workflows/omodos4-unused-stock-coverage.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/omodos4/superadmin-intelligence.js
          node --check tools/test_omodos4_unused_stock_coverage.cjs
      - name: Test source-truth coverage and cautious labels
        run: node tools/test_omodos4_unused_stock_coverage.cjs
