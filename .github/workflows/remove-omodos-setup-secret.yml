name: Remove completed OMODOS setup secret
on:
  push:
    branches:
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/remove-omodos-setup-secret.yml"
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_NEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Delete only temporary setup secret
        run: |
          set -euo pipefail
          printf 'y\n' | npx wrangler secret delete SETUP_TOKEN
          if npx wrangler secret list | grep -q '"name": "SETUP_TOKEN"'; then
            echo "SETUP_TOKEN still exists" >&2
            exit 1
          fi
          echo "Temporary setup secret removed."
