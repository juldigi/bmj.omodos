name: Stage V4 navigation safely

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'stage/v4-navigation-safe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/v4-navigation-safe
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert external assets at final document boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/index.html")
          text=p.read_text(encoding="utf-8")
          css='<link rel="stylesheet" href="/omodos4/hotfix.css" data-safe-v4="3">'
          js='<!-- OMODOS4_FRONTEND_SAFE_V3 --><script src="/omodos4/hotfix.js" defer></script>'
          if "OMODOS4_FRONTEND_SAFE_V2" in text: raise SystemExit("Unsafe V2 marker unexpectedly present")

          # Normalize any prior misplaced V3 insertions before placing them at real document boundaries.
          text=text.replace(css+"\n","").replace(css,"")
          text=text.replace(js+"\n","").replace(js,"")

          lower=text.lower()
          head_close=lower.find("</head>")
          body_open=lower.find("<body")
          if head_close<0 or body_open<0 or head_close>body_open:
              raise SystemExit("Real document head boundary not found before body")
          text=text[:head_close]+css+"\n"+text[head_close:]

          body_close=text.lower().rfind("</body>")
          if body_close<0: raise SystemExit("Final </body> not found")
          text=text[:body_close]+js+"\n"+text[body_close:]

          if text.count(css)!=1: raise SystemExit("V3 stylesheet loader count must be 1")
          if text.count("OMODOS4_FRONTEND_SAFE_V3")!=1: raise SystemExit("Loader marker count must be 1")
          css_pos=text.index(css)
          first_head_close=text.lower().find("</head>")
          first_body_open=text.lower().find("<body")
          if not (css_pos < first_head_close < first_body_open):
              raise SystemExit("Stylesheet loader must be inside the real document head")
          loader_pos=text.index(js)
          tail=text[loader_pos+len(js):].lower()
          if "<script" in tail: raise SystemExit("Loader must be the final script before </body>")
          if text.lower().rfind("</body>")<loader_pos: raise SystemExit("Loader must be before final </body>")
          p.write_text(text,encoding="utf-8")
          PY
      - name: Validate every inline script
        run: |
          node - <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('public/index.html','utf8'),rx=/<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m,n=0,fail=[];
          while((m=rx.exec(h))){n++;if(/\bsrc=/.test(m[1]))continue;try{new Function(m[2])}catch(e){fail.push({script:n,error:e.message})}}
          if(fail.length){console.error(fail);process.exit(1)} console.log('inline scripts valid:',n);
          NODE
      - name: Guard login and V4 boundaries
        run: |
          grep -q 'id="form-login"' public/index.html
          grep -q "action: 'login'" public/index.html
          grep -q 'id="v4-nav-group"' public/index.html
          grep -q 'OMODOS4_PHASE1_SAFE' public/index.html
          grep -q 'z-index:2147483000' public/omodos4/hotfix.css
          node --check public/omodos4/hotfix.js
      - name: Commit staged patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "stage: attach V4 navigation at final HTML boundary"
          git push origin HEAD:stage/v4-navigation-safe
