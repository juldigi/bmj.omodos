name: Extract V4 Integration Anchors

on:
  push:
    paths:
      - ".github/workflows/extract-v4-anchors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V4 integration anchors
        shell: python
        run: |
          from pathlib import Path
          src=Path("public/index.html").read_text(encoding="utf-8",errors="replace").splitlines()
          ranges=[[3290,3425,"sidebar-and-topnav"],[4080,4250,"home-and-view-shells"],[6260,6505,"rbac-and-navigation"],[8288,8405,"view-access-routing"]]
          out=["# V4 Integration Anchors",""]
          for start,end,label in ranges:
            out.append("## "+label)
            out.append("~~~text")
            for n in range(start,end+1):
              if 1 <= n <= len(src):
                out.append(f"{n:05d}: {src[n-1]}")
            out.append("~~~")
            out.append("")
          Path("audit").mkdir(exist_ok=True)
          Path("audit/V4_INTEGRATION_ANCHORS.md").write_text("\n".join(out)+"\n",encoding="utf-8")
      - name: Commit anchors
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/V4_INTEGRATION_ANCHORS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: extract V4 integration anchors"
          git push
