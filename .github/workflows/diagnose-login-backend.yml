name: Diagnose Login Backend 404

on:
  push:
    branches:
      - fix/login-backend-json-404
    paths:
      - ".github/workflows/diagnose-login-backend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Inspect frontend login flow and recovered Worker route
        shell: python
        run: |
          from pathlib import Path
          import os, re, json, base64, urllib.request, urllib.error, hashlib
          from datetime import datetime, timezone

          html=Path("public/index.html").read_text(encoding="utf-8",errors="replace")
          lines=html.splitlines()

          def contexts(pattern, radius=8, max_hits=12):
              rx=re.compile(pattern,re.I)
              hits=[]
              for i,line in enumerate(lines):
                  if rx.search(line):
                      lo=max(0,i-radius); hi=min(len(lines),i+radius+1)
                      hits.append((i+1, lines[lo:hi]))
                      if len(hits)>=max_hits: break
              return hits

          front_patterns={
              "apiPost": r"function\s+apiPost|const\s+apiPost|async\s+function\s+apiPost",
              "WEB_APP_URL": r"WEB_APP_URL",
              "login_action": r"action\s*[:=]\s*['\"]login['\"]|['\"]login['\"]\s*[,}]",
              "login_handler": r"login|sign\s*in",
              "fetch_calls": r"fetch\s*\(",
          }

          report=[
              "# OMODOS Login Backend 404 Diagnosis",
              "",
              f"- UTC: {datetime.now(timezone.utc).isoformat()}",
              f"- Frontend bytes: {len(html.encode('utf-8'))}",
              "",
              "## Frontend login/API anchors",
              ""
          ]

          for label,pat in front_patterns.items():
              hits=contexts(pat)
              report.append(f"### {label} — {len(hits)} sampled hit(s)")
              for lineno,block in hits:
                  report.append(f"- around line {lineno}")
                  report.append("~~~text")
                  for j,s in enumerate(block, start=max(1,lineno-8)):
                      safe=s.replace(os.environ.get("CLOUDFLARE_DEPLOY_TOKEN",""),"[redacted]")
                      report.append(f"{j:05d}: {safe[:1800]}")
                  report.append("~~~")
              report.append("")

          # Probe current production endpoint safely.
          def probe(url, method="GET", payload=None):
              data=None
              headers={"User-Agent":"OMODOS-Login-Diagnosis/1.0","Accept":"application/json,text/html,*/*"}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                      return {
                          "status":r.status,
                          "content_type":r.headers.get("Content-Type",""),
                          "bytes":len(body),
                          "sha256":hashlib.sha256(body).hexdigest(),
                          "prefix":body[:180].decode("utf-8",errors="replace").replace("\n"," "),
                      }
              except urllib.error.HTTPError as e:
                  body=e.read()
                  return {
                      "status":e.code,
                      "content_type":e.headers.get("Content-Type",""),
                      "bytes":len(body),
                      "sha256":hashlib.sha256(body).hexdigest(),
                      "prefix":body[:180].decode("utf-8",errors="replace").replace("\n"," "),
                  }
              except Exception as e:
                  return {"error":type(e).__name__+": "+str(e)}

          root="https://omodos.offsetbmj.workers.dev/"
          probes={
              "GET_root": probe(root),
              "POST_root_unknown_action": probe(root,"POST",{"action":"__omodos_readonly_probe__"}),
              "POST_api_unknown_action": probe(root+"api","POST",{"action":"__omodos_readonly_probe__"}),
              "GET_api": probe(root+"api"),
          }

          report += ["## Live production probes",""]
          for name,val in probes.items():
              report.append(f"- {name}: {json.dumps(val,ensure_ascii=False)}")
          report.append("")

          # Recover v68 Worker source from Version API.
          token=os.environ.get("CLOUDFLARE_DEPLOY_TOKEN","").strip()
          if not token:
              raise SystemExit("CLOUDFLARE_DEPLOY_TOKEN missing")

          def get_json(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=35) as r:
                  return json.loads(r.read().decode("utf-8"))

          account_id=None
          for a in get_json("https://api.cloudflare.com/client/v4/accounts?per_page=50").get("result") or []:
              aid=a.get("id")
              if not aid: continue
              try:
                  rows=(get_json(f"https://api.cloudflare.com/client/v4/accounts/{aid}/workers/workers/omodos/versions?per_page=20").get("result") or [])
              except Exception:
                  continue
              if rows:
                  account_id=aid
                  break
          if not account_id:
              raise SystemExit("Cloudflare account with omodos versions not found")

          versions=get_json(f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/workers/omodos/versions?per_page=20").get("result") or []
          recover=None
          recover_number=None
          for v in versions:
              vid=v.get("id")
              if not vid: continue
              try:
                  detail=get_json(f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/workers/omodos/versions/{vid}?include=modules").get("result") or {}
              except Exception:
                  continue
              mods=detail.get("modules") or []
              decoded=[]
              for m in mods:
                  b64=m.get("content_base64") if isinstance(m,dict) else None
                  if isinstance(b64,str) and b64:
                      try: raw=base64.b64decode(b64)
                      except Exception: raw=b""
                      if raw: decoded.append((len(raw),m,raw))
              if decoded:
                  size,m,raw=max(decoded,key=lambda x:x[0])
                  if size>100000:
                      recover=raw.decode("utf-8",errors="replace")
                      recover_number=v.get("number")
                      break

          if not recover:
              raise SystemExit("No recoverable Worker source found in recent versions")

          wlines=recover.splitlines()
          def worker_contexts(pattern, radius=10, max_hits=20):
              rx=re.compile(pattern,re.I)
              out=[]
              for i,line in enumerate(wlines):
                  if rx.search(line):
                      out.append((i+1,wlines[max(0,i-radius):min(len(wlines),i+radius+1)]))
                      if len(out)>=max_hits: break
              return out

          worker_patterns={
              "login_action": r"login",
              "fetch_handler": r"fetch\s*\(|async\s+fetch|request\.method",
              "route_path": r"url\.pathname|pathname|/api",
              "json_response": r"application/json|JSON\.stringify",
              "durable_object": r"MaintenanceStore|DurableObject|idFromName|getByName",
          }

          report += [f"## Recovered Worker route map (version {recover_number})",""]
          for label,pat in worker_patterns.items():
              hits=worker_contexts(pat)
              report.append(f"### {label} — {len(hits)} sampled hit(s)")
              for lineno,block in hits[:12]:
                  report.append(f"- around worker line {lineno}")
                  report.append("~~~text")
                  for j,s in enumerate(block,start=max(1,lineno-10)):
                      report.append(f"{j:05d}: {s[:1800]}")
                  report.append("~~~")
              report.append("")

          # Quick route fingerprints.
          route_literals=sorted(set(re.findall(r"['\"](/[^'\"]{1,120})['\"]",recover)))
          login_routes=[x for x in route_literals if "login" in x.lower() or "auth" in x.lower() or "api" in x.lower()]
          report += ["## Route literals of interest",""]
          for x in login_routes[:120]:
              report.append(f"- {x}")
          report.append("")

          Path("audit").mkdir(exist_ok=True)
          Path("audit/LOGIN_BACKEND_404_DIAGNOSIS.md").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("[LOGIN_DIAGNOSIS] complete")

      - name: Commit diagnosis
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/LOGIN_BACKEND_404_DIAGNOSIS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: diagnose login backend 404"
          git push
