name: Deploy OMODOS Assets Candidate to Production

on:
  push:
    branches:
      - deploy/assets-only-fresh-shell
    paths:
      - ".github/workflows/deploy-assets-candidate-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CF_ACCOUNT_ID: 3c0bf44ff86c9587390f09b6d0bc42dd
      WORKER_NAME: omodos
      CANDIDATE_VERSION: 2ec6941c-3f9d-433f-8646-bbd9858df1fc
      PRODUCTION_URL: https://omodos.offsetbmj.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Start 0.01 percent smoke deployment
        shell: python
        run: |
          import os,json,time,urllib.request,urllib.error
          from pathlib import Path

          token=os.environ["CLOUDFLARE_API_TOKEN"]
          aid=os.environ["CF_ACCOUNT_ID"]
          worker=os.environ["WORKER_NAME"]
          candidate=os.environ["CANDIDATE_VERSION"]
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{aid}/workers/scripts/{worker}/deployments"

          def api(method,url,payload=None):
            h={"Authorization":"Bearer "+token,"Accept":"application/json"}
            data=None
            if payload is not None:
              data=json.dumps(payload,separators=(",",":")).encode()
              h["Content-Type"]="application/json"
            req=urllib.request.Request(url,data=data,method=method,headers=h)
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                raw=r.read()
                return r.status,json.loads(raw.decode("utf-8")) if raw else {}
            except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8",errors="replace")
              try: parsed=json.loads(raw)
              except Exception: parsed={"raw":raw[:1000]}
              return e.code,parsed

          status,d=api("GET",endpoint)
          if status!=200:
            raise SystemExit("Cannot read current deployment: "+json.dumps(d))
          rr=d.get("result")
          rows=(rr.get("deployments") or []) if isinstance(rr,dict) else (rr if isinstance(rr,list) else [])
          if not rows:
            raise SystemExit("No current deployment")
          current=rows[0]
          active=[v for v in current.get("versions") or [] if float(v.get("percentage") or 0)>0]
          if len(active)!=1 or abs(float(active[0].get("percentage") or 0)-100)>0.001:
            raise SystemExit("Expected single 100% current version: "+json.dumps(active))
          old=str(active[0].get("version_id") or "")
          if not old or old==candidate:
            raise SystemExit("Invalid old/candidate state: old="+old+" candidate="+candidate)

          Path("/tmp/old-version").write_text(old)
          with Path(os.environ["GITHUB_ENV"]).open("a") as f:
            f.write("OLD_VERSION="+old+"\n")

          payload={
            "strategy":"percentage",
            "versions":[
              {"version_id":old,"percentage":99.99},
              {"version_id":candidate,"percentage":0.01}
            ],
            "annotations":{
              "workers/message":"OMODOS assets v81 controlled smoke"
            }
          }
          status,created=api("POST",endpoint,payload)
          if status<200 or status>=300:
            raise SystemExit("Smoke deployment HTTP "+str(status)+": "+json.dumps(created.get("errors") or created))

          time.sleep(3)
          verify_status,verify=api("GET",endpoint)
          if verify_status!=200:
            raise SystemExit("Unable to verify smoke deployment: "+json.dumps(verify))
          vr=verify.get("result")
          vrows=(vr.get("deployments") or []) if isinstance(vr,dict) else (vr if isinstance(vr,list) else [])
          if not vrows:
            raise SystemExit("Smoke deployment verification returned no rows")
          newest=vrows[0]
          got={str(v.get("version_id")):float(v.get("percentage") or 0) for v in newest.get("versions") or []}
          if abs(got.get(old,0)-99.99)>0.001 or abs(got.get(candidate,0)-0.01)>0.001:
            raise SystemExit("Unexpected verified smoke deployment: "+json.dumps(got))

          print("[DEPLOY_SMOKE] old="+old)
          print("[DEPLOY_SMOKE] candidate="+candidate)
          print("[DEPLOY_SMOKE] id="+str(newest.get("id") or ""))
          time.sleep(3)

      - name: Force HTTP QA to candidate
        shell: python
        run: |
          import os,urllib.request,urllib.error,hashlib,time,json
          from pathlib import Path

          base=os.environ["PRODUCTION_URL"].rstrip("/")
          candidate=os.environ["CANDIDATE_VERSION"]
          worker=os.environ["WORKER_NAME"]
          expected=hashlib.sha256(Path("public/index.html").read_bytes()).hexdigest()
          override=worker+'="'+candidate+'"'

          last={}
          for attempt in range(1,7):
            req=urllib.request.Request(
              base+"/?candidate_override="+str(attempt),
              headers={
                "User-Agent":"OMODOS-v81-Override-QA/1.0",
                "Cache-Control":"no-cache",
                "Cloudflare-Workers-Version-Overrides":override
              }
            )
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                status=r.status; headers=r.headers; body=r.read()
            except urllib.error.HTTPError as e:
              status=e.code; headers=e.headers; body=e.read()

            text=body.decode("utf-8",errors="replace")
            cache=headers.get("Cache-Control") or ""
            build=headers.get("X-OMODOS-Build") or ""
            checks={
              "http_200":status==200,
              "exact_html":hashlib.sha256(body).hexdigest()==expected,
              "no_store":"no-store" in cache.lower(),
              "build_header":build=="bantuan-copilot-20260920",
              "copilot_help":'id="copilot-help"' in text,
              "cleanup_marker":"BANTUAN_PAGE_CARD_REMOVAL_V1" in text,
              "old_injector_absent":"top.insertAdjacentElement('afterend',guide)" not in text,
              "machine_dropdown":'id="filter-machine"' in text
            }
            last={"status":status,"cache":cache,"build":build,"checks":checks}
            if all(checks.values()):
              break
            time.sleep(3)
          else:
            raise SystemExit("Forced candidate QA failed: "+json.dumps(last,sort_keys=True))

          Path("/tmp/override-qa.json").write_text(json.dumps(last,sort_keys=True))
          print("[OVERRIDE_QA] PASS "+json.dumps(last,sort_keys=True))

      - name: Promote candidate to 100 percent
        shell: python
        run: |
          import os,json,time,urllib.request,urllib.error

          token=os.environ["CLOUDFLARE_API_TOKEN"]
          aid=os.environ["CF_ACCOUNT_ID"]
          worker=os.environ["WORKER_NAME"]
          candidate=os.environ["CANDIDATE_VERSION"]
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{aid}/workers/scripts/{worker}/deployments"

          payload={
            "strategy":"percentage",
            "versions":[{"version_id":candidate,"percentage":100}],
            "annotations":{
              "workers/message":"OMODOS assets v81 promoted after preview + override QA PASS"
            }
          }
          req=urllib.request.Request(
            endpoint,
            data=json.dumps(payload,separators=(",",":")).encode(),
            method="POST",
            headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/json",
              "Content-Type":"application/json"
            }
          )
          try:
            with urllib.request.urlopen(req,timeout=45) as r:
              status=r.status
              d=json.loads(r.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
            raw=e.read().decode("utf-8",errors="replace")
            raise SystemExit("Promotion HTTP "+str(e.code)+": "+raw[:1500])

          time.sleep(3)
          verify_req=urllib.request.Request(
            endpoint,
            headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
          )
          with urllib.request.urlopen(verify_req,timeout=45) as r:
            verify=json.loads(r.read().decode("utf-8"))
          vr=verify.get("result")
          rows=(vr.get("deployments") or []) if isinstance(vr,dict) else (vr if isinstance(vr,list) else [])
          if not rows:
            raise SystemExit("Promotion verification returned no deployment rows")
          versions=rows[0].get("versions") or []
          if len(versions)!=1 or str(versions[0].get("version_id"))!=candidate or abs(float(versions[0].get("percentage") or 0)-100)>0.001:
            raise SystemExit("Unexpected verified promotion result: "+json.dumps(versions))
          print("[PROMOTE] v81 at 100%")
          time.sleep(3)

      - name: Validate production live
        shell: python
        run: |
          import os,urllib.request,urllib.error,hashlib,time,json
          from pathlib import Path
          from datetime import datetime,timezone

          base=os.environ["PRODUCTION_URL"].rstrip("/")
          expected=hashlib.sha256(Path("public/index.html").read_bytes()).hexdigest()
          last={}
          for attempt in range(1,7):
            req=urllib.request.Request(
              base+"/?live_verify="+str(attempt),
              headers={"User-Agent":"OMODOS-Live-Verify/1.0","Cache-Control":"no-cache"}
            )
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                status=r.status; headers=r.headers; body=r.read()
            except urllib.error.HTTPError as e:
              status=e.code; headers=e.headers; body=e.read()

            text=body.decode("utf-8",errors="replace")
            cache=headers.get("Cache-Control") or ""
            build=headers.get("X-OMODOS-Build") or ""
            checks={
              "http_200":status==200,
              "exact_html":hashlib.sha256(body).hexdigest()==expected,
              "no_store":"no-store" in cache.lower(),
              "build_header":build=="bantuan-copilot-20260920",
              "copilot_help":'id="copilot-help"' in text,
              "cleanup_marker":"BANTUAN_PAGE_CARD_REMOVAL_V1" in text,
              "old_injector_absent":"top.insertAdjacentElement('afterend',guide)" not in text,
              "machine_dropdown":'id="filter-machine"' in text,
              "omodos4":"OMODOS 4.0" in text
            }
            last={"status":status,"cache":cache,"build":build,"checks":checks}
            if all(checks.values()):
              break
            time.sleep(3)
          else:
            raise SystemExit("Live validation failed: "+json.dumps(last,sort_keys=True))

          report=[
            "# OMODOS Assets v81 Production Deployment",
            "",
            f"- Validated UTC: {datetime.now(timezone.utc).isoformat()}",
            f"- Production version: {os.environ['CANDIDATE_VERSION']}",
            "- Deployment: 0.01% smoke -> forced version override QA -> 100%",
            f"- Live HTTP: {last['status']}",
            f"- Cache-Control: {last['cache']}",
            f"- X-OMODOS-Build: {last['build']}",
            f"- Checks: {json.dumps(last['checks'],sort_keys=True)}",
            "- Login/auth application JavaScript: byte-identical to pre-deployment live HTML",
            "- Worker architecture: assets-only, same as previous production v79",
            "- Page-level Bantuan cards: removed",
            "- Bantuan button: Copilot only",
            "- Production verdict: PASS"
          ]
          Path("audit").mkdir(exist_ok=True)
          Path("audit/ASSETS_V81_PRODUCTION.md").write_text("\n".join(report)+"\n",encoding="utf-8")
          print("[LIVE_VALIDATE] PASS "+json.dumps(last,sort_keys=True))

      - name: Roll back on failure
        if: failure()
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          from pathlib import Path

          old=os.environ.get("OLD_VERSION","").strip()
          if not old and Path("/tmp/old-version").exists():
            old=Path("/tmp/old-version").read_text().strip()
          if not old:
            print("[ROLLBACK] No prior version recorded; first deployment likely never succeeded.")
            raise SystemExit(0)

          token=os.environ["CLOUDFLARE_API_TOKEN"]
          aid=os.environ["CF_ACCOUNT_ID"]
          worker=os.environ["WORKER_NAME"]
          endpoint=f"https://api.cloudflare.com/client/v4/accounts/{aid}/workers/scripts/{worker}/deployments?force=true"
          payload={
            "strategy":"percentage",
            "versions":[{"version_id":old,"percentage":100}],
            "annotations":{
              "workers/message":"OMODOS automatic rollback after assets v81 QA failure"
            }
          }
          req=urllib.request.Request(
            endpoint,
            data=json.dumps(payload,separators=(",",":")).encode(),
            method="POST",
            headers={
              "Authorization":"Bearer "+token,
              "Accept":"application/json",
              "Content-Type":"application/json"
            }
          )
          try:
            with urllib.request.urlopen(req,timeout=45) as r:
              d=json.loads(r.read().decode("utf-8"))
              print("[ROLLBACK] restored="+old+" success="+str(d.get("success")))
          except urllib.error.HTTPError as e:
            raw=e.read().decode("utf-8",errors="replace")
            print("[ROLLBACK] HTTP "+str(e.code)+" "+raw[:1500])
            raise

      - name: Commit production report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/ASSETS_V81_PRODUCTION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: record OMODOS assets v81 production rollout"
          git push
