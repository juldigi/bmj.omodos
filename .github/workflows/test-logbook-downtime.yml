name: Logbook downtime choice guard

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'src/worker.js'
      - 'tools/test_logbook_downtime_choice.cjs'
      - '.github/workflows/test-logbook-downtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'src/worker.js'
      - 'tools/test_logbook_downtime_choice.cjs'
      - '.github/workflows/test-logbook-downtime.yml'

permissions:
  contents: read

jobs:
  test-logbook-downtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Logbook downtime rules
        run: node tools/test_logbook_downtime_choice.cjs
