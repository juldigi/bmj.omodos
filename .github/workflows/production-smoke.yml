name: OMODOS Production Smoke Guard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Guard stable Worker configuration
        run: |
          grep -q '"main": "src/worker.js"' wrangler.jsonc
          grep -q '"no_bundle": true' wrangler.jsonc
          node --check public/omodos4/hotfix.js
          test -s public/omodos4/hotfix.css
          grep -Fq "X-OMODOS-Build: omodos-20261001-r1" public/_headers
          grep -Fq '__Host-OMODOSFileSession' src/worker.js
          grep -Fq 'requireFileSession(request, backend)' src/worker.js
          grep -Fq '"Cache-Control": "private, no-store, max-age=0"' src/worker.js

      - name: Verify production login and V4 assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT_URL="https://omodos.juldigi.workers.dev/"
          API_URL="https://omodos.juldigi.workers.dev/api"
          JS_URL="https://omodos.juldigi.workers.dev/omodos4/hotfix.js"
          CSS_URL="https://omodos.juldigi.workers.dev/omodos4/hotfix.css"
          EXPECTED_BUILD="omodos-20261001-r1"
          passed=0

          for i in $(seq 1 24); do
            HTML="$(curl -fsS "$ROOT_URL" || true)"
            JS="$(curl -fsS "$JS_URL" || true)"
            CSS="$(curl -fsS "$CSS_URL" || true)"
            HEADERS="$(curl -fsSI "$ROOT_URL" 2>/dev/null | tr -d '\r' || true)"
            BUILD="$(awk -F': *' 'tolower($1)=="x-omodos-build"{print $2}' <<< "$HEADERS" | tail -1)"
            STATUS="$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"action":"login","username":"__omodos_smoke_invalid__","password":"__omodos_smoke_invalid__"}' "$API_URL" || true)"
            FILE_STATUS="$(curl -sS -o /tmp/file-guard.json -w '%{http_code}' "$ROOT_URL/files/__omodos_smoke_missing__" || true)"

            if grep -q 'id="form-login"' <<< "$HTML" && grep -q 'OMODOS4_FRONTEND_SAFE_V3' <<< "$HTML" && grep -q '/omodos4/hotfix.css' <<< "$HTML" && grep -q '/omodos4/hotfix.js' <<< "$HTML" && grep -q 'frontend-only recovery' <<< "$JS" && [ -n "$CSS" ] && [ "$BUILD" = "$EXPECTED_BUILD" ] && [ "$STATUS" = "200" ] && [ "$FILE_STATUS" = "401" ]; then
              if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/login.json','utf8'));if(!x||typeof x!=='object'||x.ok!==false)process.exit(1)"; then
                passed=1
                break
              fi
            fi
            sleep 5
          done

          test "$passed" = "1"
          grep -q 'id="v4-nav-group"' <<< "$HTML"
          test "$(printf '%s' "$HTML" | grep -o 'OMODOS4_FRONTEND_SAFE_V3' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s' "$HTML" | grep -o '/omodos4/hotfix.css' | wc -l | tr -d ' ')" = "1"
          printf '%s' "$JS" > /tmp/omodos-hotfix.js
          node --check /tmp/omodos-hotfix.js
          grep -Fq "Buka profil mesin" /tmp/omodos-hotfix.js
          grep -Fq "Tampilkan prioritas pembelian" /tmp/omodos-hotfix.js
          grep -Fq "Cari teknisi berpengalaman" /tmp/omodos-hotfix.js
          grep -Fq "Nilai hubungan (-1 sampai +1)" /tmp/omodos-hotfix.js
          grep -Fq "Tingkat perbedaan " /tmp/omodos-hotfix.js
          grep -Fq "function confidenceLabel" /tmp/omodos-hotfix.js
          grep -Fq "if(n<1||n>100)" /tmp/omodos-hotfix.js
          ! grep -Fq "Kekuatan hubungan (Pearson r)" /tmp/omodos-hotfix.js
          ! grep -Fq "Jarak pola " /tmp/omodos-hotfix.js
          ! grep -Fq "Muat Analisis" /tmp/omodos-hotfix.js
