name: OMODOS Production Smoke Guard

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/production-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Wrangler bundle
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/omodos-smoke-dry-run

      - name: Guard stable Worker configuration
        run: |
          grep -q '"main": "src/worker.js"' wrangler.jsonc
          grep -q '"no_bundle": true' wrangler.jsonc
          node --check public/omodos4/hotfix.js
          node --check public/omodos4/offset-ways.js
          node --check public/omodos4/technical-performance.js
          grep -Fq 'technicalPerformanceRead' src/worker.js
          grep -Fq 'requireSuperadmin_(body.actor)' src/worker.js
          grep -Fq 'TECHNICAL_PERFORMANCE_MODULE_LOADER_V1' public/omodos4/hotfix.js
          test -s public/omodos4/hotfix.css
          test -s public/omodos4/offset-ways.css
          grep -Fq "X-OMODOS-Build: omodos-20261021-technical-performance-r1" public/_headers
          grep -Fq '__Host-OMODOSFileSession' src/worker.js
          grep -Fq 'requireFileSession(request, backend)' src/worker.js
          grep -Fq '"Cache-Control": "private, no-store, max-age=0"' src/worker.js
          grep -Fq 'add("updateApprovalDecision", "report.manage", "POST", true);' src/worker.js

      - name: Verify production login and V4 assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://omodos.juldigi.workers.dev"
          ROOT_URL="$BASE_URL/"
          API_URL="$BASE_URL/api"
          JS_URL="https://omodos.juldigi.workers.dev/omodos4/hotfix.js"
          TP_JS_URL="https://omodos.juldigi.workers.dev/omodos4/technical-performance.js"
          ADMIN_JS_URL="https://omodos.juldigi.workers.dev/omodos4/superadmin-intelligence.js"
          CSS_URL="https://omodos.juldigi.workers.dev/omodos4/hotfix.css"
          OW_JS_URL="https://omodos.juldigi.workers.dev/omodos4/offset-ways.js"
          OW_CSS_URL="https://omodos.juldigi.workers.dev/omodos4/offset-ways.css"
          EXPECTED_BUILD="omodos-20261021-technical-performance-r1"
          passed=0

          has_marker() { grep -Fq "$1" <<< "$2"; }
          has_not_marker() { ! grep -Fq "$1" <<< "$2"; }
          check_marker() {
            local label="$1" marker="$2" content="$3"
            if has_marker "$marker" "$content"; then
              echo "[SMOKE_PASS] $label"
            else
              echo "[SMOKE_FAIL] $label (required marker missing)"
              return 1
            fi
          }
          check_absent() {
            local label="$1" marker="$2" content="$3"
            if has_not_marker "$marker" "$content"; then
              echo "[SMOKE_PASS] $label"
            else
              echo "[SMOKE_FAIL] $label (deprecated marker found)"
              return 1
            fi
          }

          for i in $(seq 1 6); do
            echo "[SMOKE] attempt $i/6"
            HTML="$(curl --max-time 10 -fsS "$ROOT_URL" || true)"
            JS="$(curl --max-time 10 -fsS "$JS_URL" || true)"
            TP_JS="$(curl --max-time 10 -fsS "$TP_JS_URL" || true)"
            ADMIN_JS="$(curl --max-time 10 -fsS "$ADMIN_JS_URL" || true)"
            CSS="$(curl --max-time 10 -fsS "$CSS_URL" || true)"
            OW_JS="$(curl --max-time 10 -fsS "$OW_JS_URL" || true)"
            OW_CSS="$(curl --max-time 10 -fsS "$OW_CSS_URL" || true)"
            HEADERS="$(curl --max-time 10 -fsSI "$ROOT_URL" 2>/dev/null | tr -d '\r' || true)"
            BUILD="$(awk -F': *' 'tolower($1)=="x-omodos-build"{print $2}' <<< "$HEADERS" | tail -1)"
            STATUS="$(curl --max-time 10 -sS -o /tmp/login.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"action":"login","username":"__omodos_smoke_invalid__","password":"__omodos_smoke_invalid__"}' "$API_URL" || true)"
            FILE_STATUS="$(curl --max-time 10 -sS -o /tmp/file-guard.json -w '%{http_code}' "$BASE_URL/files/__omodos_smoke_missing__" || true)"
            LOGIN_JSON_OK="no"
            LOGIN_OK_VALUE="missing"
            if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/login.json','utf8'));if(!x||typeof x!=='object'||x.ok!==false)process.exit(1)" 2>/dev/null; then
              LOGIN_JSON_OK="yes"
              LOGIN_OK_VALUE="false"
            elif node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/login.json','utf8'));console.log(String(x&&x.ok))" >/tmp/login-ok.txt 2>/dev/null; then
              LOGIN_OK_VALUE="$(cat /tmp/login-ok.txt)"
            fi

            HTML_LOGIN="no"; has_marker 'id="form-login"' "$HTML" && HTML_LOGIN="yes"
            HTML_V4="no"; has_marker 'id="v4-nav-group"' "$HTML" && HTML_V4="yes"
            HTML_HOTFIX="no"; has_marker 'OMODOS4_FRONTEND_SAFE_V3' "$HTML" && HTML_HOTFIX="yes"
            HTML_CSS="no"; has_marker '/omodos4/hotfix.css' "$HTML" && HTML_CSS="yes"
            HTML_JS="no"; has_marker '/omodos4/hotfix.js' "$HTML" && HTML_JS="yes"
            JS_RECOVERY="no"; has_marker 'frontend-only recovery' "$ADMIN_JS" && JS_RECOVERY="yes"
            OW_MODULE="no"; has_marker 'window.OMODOS_OFFSET_WAYS' "$OW_JS" && OW_MODULE="yes"
            OW_THEME="no"; has_marker 'omodos-2.0' "$OW_JS" && OW_THEME="yes"
            OW_STYLE="no"; has_marker '.ow-hero' "$OW_CSS" && OW_STYLE="yes"

            echo "[SMOKE_DIAG] build='$BUILD' expected='$EXPECTED_BUILD' html_login=$HTML_LOGIN html_v4=$HTML_V4 html_hotfix=$HTML_HOTFIX html_css=$HTML_CSS html_js=$HTML_JS admin_js_bytes=$(printf '%s' "$ADMIN_JS" | wc -c | tr -d ' ') recovery=$JS_RECOVERY css_bytes=$(printf '%s' "$CSS" | wc -c | tr -d ' ') login_http=$STATUS login_json_ok=$LOGIN_JSON_OK login_ok=$LOGIN_OK_VALUE file_guard_http=$FILE_STATUS offset_js_bytes=$(printf '%s' "$OW_JS" | wc -c | tr -d ' ') offset_module=$OW_MODULE offset_theme=$OW_THEME offset_css_bytes=$(printf '%s' "$OW_CSS" | wc -c | tr -d ' ') offset_style=$OW_STYLE"

            if [ "$HTML_LOGIN" = "yes" ] && [ "$HTML_V4" = "yes" ] && [ "$HTML_HOTFIX" = "yes" ] && [ "$HTML_CSS" = "yes" ] && [ "$HTML_JS" = "yes" ] && [ "$JS_RECOVERY" = "yes" ] && [ -n "$ADMIN_JS" ] && grep -Fq "OMODOS Technical Performance" <<< "$TP_JS" && [ -n "$CSS" ] && [ "$BUILD" = "$EXPECTED_BUILD" ] && [ "$STATUS" = "200" ] && [ "$FILE_STATUS" = "401" ] && [ "$LOGIN_JSON_OK" = "yes" ] && [ "$OW_MODULE" = "yes" ] && [ "$OW_THEME" = "yes" ] && [ "$OW_STYLE" = "yes" ]; then
              passed=1
              break
            fi
            sleep 5
          done

          if [ "$passed" != "1" ]; then
            echo "::error::Production smoke failed. Review [SMOKE_DIAG] values above to identify the mismatched host, asset, header, or API contract."
            exit 1
          fi

          check_marker "single V4 frontend marker" 'OMODOS4_FRONTEND_SAFE_V3' "$HTML"
          test "$(printf '%s' "$HTML" | grep -o 'OMODOS4_FRONTEND_SAFE_V3' | wc -l | tr -d ' ')" = "1"
          test "$(printf '%s' "$HTML" | grep -o '/omodos4/hotfix.css' | wc -l | tr -d ' ')" = "1"

          printf '%s' "$TP_JS" > /tmp/omodos-technical-performance.js
          node --check /tmp/omodos-technical-performance.js
          printf '%s' "$JS" > /tmp/omodos-hotfix.js
          printf '%s' "$ADMIN_JS" > /tmp/omodos-superadmin-intelligence.js
          printf '%s' "$OW_JS" > /tmp/omodos-offset-ways.js
          node --check /tmp/omodos-hotfix.js
          node --check /tmp/omodos-superadmin-intelligence.js
          node --check /tmp/omodos-offset-ways.js
          check_marker "Superadmin bundle version" "version:'4.0-master-recovery-100'" "$ADMIN_JS"
          check_marker "machine profile link" "Buka profil mesin" "$ADMIN_JS"
          check_marker "sparepart purchase priority" "Tampilkan prioritas pembelian" "$ADMIN_JS"
          check_marker "expert technician finder" "Cari teknisi berpengalaman" "$ADMIN_JS"
          check_marker "correlation scale label" "Nilai hubungan (-1 sampai +1)" "$ADMIN_JS"
          check_marker "difference level label" "Tingkat perbedaan " "$ADMIN_JS"
          check_marker "confidence label helper" "function confidenceLabel" "$ADMIN_JS"
          check_marker "percentage validation" "if(n<1||n>100)" "$ADMIN_JS"
          check_absent "legacy Pearson label removed" "Kekuatan hubungan (Pearson r)" "$ADMIN_JS"
          check_absent "legacy pattern distance removed" "Jarak pola " "$ADMIN_JS"
          check_absent "legacy load-analysis control removed" "Muat Analisis" "$ADMIN_JS"
          check_marker "Offset Ways database read action" "offsetWaysRead" "$OW_JS"
          check_marker "Offset Ways database write action" "offsetWaysSave" "$OW_JS"
          check_marker "native theme registry integration" "registerThemeInThemeManager" "$OW_JS"
          echo "[SMOKE_PASS] Production login contract, OMODOS 4 assets, and Offset Ways/OMODOS 2.0 assets."
