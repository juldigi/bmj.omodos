name: Emergency Restore Stable Login
on:
  push:
    branches:
      - hotfix/restore-login-stable
    paths:
      - ".github/workflows/emergency-restore-login.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c0bf44ff86c9587390f09b6d0bc42dd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Validate stable package
        run: |
          grep -q '"main": "src/worker.js"' wrangler.jsonc
          grep -q '"no_bundle": true' wrangler.jsonc
          npx wrangler deploy --dry-run --outdir /tmp/omodos-stable
      - name: Restore production
        run: npx wrangler deploy
      - name: Verify login API and page
        run: |
          for i in $(seq 1 20); do
            ROOT="$(curl -fsS https://omodos.offsetbmj.workers.dev/ || true)"
            API="$(curl -fsS -X POST -H 'content-type: application/json' --data '{"action":"login","username":"__smoke_invalid__","password":"__smoke_invalid__"}' https://omodos.offsetbmj.workers.dev/api || true)"
            if printf '%s' "$ROOT" | grep -q 'Masukkan username' && printf '%s' "$API" | grep -q '"ok":false'; then exit 0; fi
            sleep 3
          done
          exit 1
