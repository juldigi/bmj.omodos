name: Repair Missing Static Dependencies

on:
  push:
    branches:
      - fix/vendor-assets-and-v4-404
    paths:
      - ".github/workflows/repair-static-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/vendor

          fetch() {
            local url="$1"
            local out="$2"
            echo "Fetching $out"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$out"
            test -s "$out"
          }

          fetch "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" "public/vendor/html2canvas.min.js"
          fetch "https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js" "public/vendor/jspdf.min.js"
          fetch "https://unpkg.com/docx@8.5.0/build/index.umd.js" "public/vendor/docx.min.js"
          fetch "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" "public/vendor/xlsx.min.js"
          fetch "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" "public/vendor/exceljs.min.js"
          fetch "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" "public/vendor/chart.min.js"
          fetch "https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js" "public/vendor/vis-network.min.js"

          python - <<'PY'
          from pathlib import Path
          minimums={
            "html2canvas.min.js":100_000,
            "jspdf.min.js":100_000,
            "docx.min.js":500_000,
            "xlsx.min.js":500_000,
            "exceljs.min.js":500_000,
            "chart.min.js":100_000,
            "vis-network.min.js":300_000,
          }
          for name,min_bytes in minimums.items():
            p=Path("public/vendor")/name
            size=p.stat().st_size
            print(name,size)
            if size < min_bytes:
              raise SystemExit(f"{name} unexpectedly small: {size}")
          PY

      - name: Remove obsolete OMODOS4 external references
        shell: python
        run: |
          from pathlib import Path

          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")

          old_css='<link rel="stylesheet" href="/omodos4/omodos4.css">\n'
          old_js='<script src="/omodos4/bootstrap.js"></script>\n'

          if old_css not in s:
            raise SystemExit("Expected /omodos4/omodos4.css reference not found")
          if old_js not in s:
            raise SystemExit("Expected /omodos4/bootstrap.js reference not found")

          s=s.replace(old_css,"",1)
          s=s.replace(old_js,"",1)

          if "/omodos4/omodos4.css" in s or "/omodos4/bootstrap.js" in s:
            raise SystemExit("Obsolete OMODOS4 external reference still present")

          required=[
            '/vendor/html2canvas.min.js',
            '/vendor/jspdf.min.js',
            '/vendor/docx.min.js',
            '/vendor/xlsx.min.js',
            '/vendor/exceljs.min.js',
            '/vendor/chart.min.js',
            '/vendor/vis-network.min.js',
            'OMODOS4_PHASE1_SAFE',
            'id="omodos4-phase1-script"',
          ]
          missing=[x for x in required if x not in s]
          if missing:
            raise SystemExit("Required frontend reference missing: "+", ".join(missing))

          p.write_text(s,encoding="utf-8")
          print("Removed two obsolete OMODOS4 external resource requests.")

      - name: Create third-party manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json

          packages=[
            {
              "file":"html2canvas.min.js","package":"html2canvas","version":"1.4.1",
              "license":"MIT","source":"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
            },
            {
              "file":"jspdf.min.js","package":"jspdf","version":"2.5.2",
              "license":"MIT","source":"https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"
            },
            {
              "file":"docx.min.js","package":"docx","version":"8.5.0",
              "license":"MIT","source":"https://unpkg.com/docx@8.5.0/build/index.umd.js"
            },
            {
              "file":"xlsx.min.js","package":"xlsx","version":"0.18.5",
              "license":"Apache-2.0","source":"https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
            },
            {
              "file":"exceljs.min.js","package":"exceljs","version":"4.4.0",
              "license":"MIT","source":"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"
            },
            {
              "file":"chart.min.js","package":"Chart.js","version":"4.5.1",
              "license":"MIT","source":"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"
            },
            {
              "file":"vis-network.min.js","package":"vis-network","version":"9.1.9",
              "license":"MIT OR Apache-2.0","source":"https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"
            },
          ]
          for item in packages:
            raw=(Path("public/vendor")/item["file"]).read_bytes()
            item["bytes"]=len(raw)
            item["sha256"]=hashlib.sha256(raw).hexdigest()

          Path("public/vendor/manifest.json").write_text(
            json.dumps({"schema":1,"packages":packages},indent=2)+"\n",
            encoding="utf-8"
          )

          lines=[
            "# Vendored Browser Dependencies",
            "",
            "These files are pinned local browser builds used by OMODOS so production features do not depend on a third-party CDN at runtime.",
            "",
            "| Local file | Package | Version | License |",
            "|---|---|---:|---|",
          ]
          for x in packages:
            lines.append(f"| {x['file']} | {x['package']} | {x['version']} | {x['license']} |")
          lines += [
            "",
            "Exact source URLs and SHA-256 fingerprints are recorded in manifest.json.",
            ""
          ]
          Path("public/vendor/README.md").write_text("\n".join(lines),encoding="utf-8")

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser validate all vendor globals
        shell: bash
        run: |
          cat > public/vendor-test.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <script src="/vendor/html2canvas.min.js"></script>
            <script src="/vendor/jspdf.min.js"></script>
            <script src="/vendor/docx.min.js"></script>
            <script src="/vendor/xlsx.min.js"></script>
            <script src="/vendor/exceljs.min.js"></script>
            <script src="/vendor/chart.min.js"></script>
            <script src="/vendor/vis-network.min.js"></script>
          </head>
          <body><div id="ok">vendor test</div></body>
          </html>
          HTML

          python3 -m http.server 4173 --directory public >/tmp/vendor-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f public/vendor-test.html vendor-qa.mjs' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/vendor-test.html >/dev/null && break
            sleep 1
          done

          cat > vendor-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/vendor-test.html',{waitUntil:'load',timeout:25000});

            const r=await page.evaluate(()=>{
              const checks={
                html2canvas: typeof window.html2canvas==='function',
                jspdf: !!(window.jspdf && typeof window.jspdf.jsPDF==='function'),
                docx: !!(window.docx && typeof window.docx.Document==='function' && typeof window.docx.Packer==='function'),
                xlsx: !!(window.XLSX && typeof window.XLSX.read==='function' && typeof window.XLSX.utils?.book_new==='function'),
                exceljs: !!(window.ExcelJS && typeof window.ExcelJS.Workbook==='function'),
                chart: typeof window.Chart==='function',
                vis: !!(window.vis && typeof window.vis.Network==='function' && typeof window.vis.DataSet==='function'),
              };

              let jspdfConstruct=false, xlsxConstruct=false, excelConstruct=false, visConstruct=false;
              try{ const p=new window.jspdf.jsPDF(); jspdfConstruct=!!p; }catch{}
              try{ xlsxConstruct=!!window.XLSX.utils.book_new(); }catch{}
              try{ excelConstruct=!!new window.ExcelJS.Workbook(); }catch{}
              try{ visConstruct=!!new window.vis.DataSet([{id:1,label:'A'}]); }catch{}

              return {checks,jspdfConstruct,xlsxConstruct,excelConstruct,visConstruct};
            });

            console.log('[VENDOR_QA] '+JSON.stringify({result:r,errors}));
            if(Object.values(r.checks).some(v=>!v)) throw new Error('Missing vendor global: '+JSON.stringify(r.checks));
            if(!r.jspdfConstruct || !r.xlsxConstruct || !r.excelConstruct || !r.visConstruct){
              throw new Error('Vendor constructor smoke test failed: '+JSON.stringify(r));
            }
            if(errors.length) throw new Error('Vendor browser errors: '+JSON.stringify(errors));
          } finally {
            await browser.close();
          }
          JS

          node --check vendor-qa.mjs
          node vendor-qa.mjs

      - name: Validate index and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/vendor-test.html vendor-qa.mjs package.json package-lock.json

          for f in html2canvas.min.js jspdf.min.js docx.min.js xlsx.min.js exceljs.min.js chart.min.js vis-network.min.js; do
            test -s "public/vendor/$f"
          done

          ! grep -q '/omodos4/omodos4.css' public/index.html
          ! grep -q '/omodos4/bootstrap.js' public/index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/vendor
          git commit -m "fix: vendor required browser libraries and remove dead V4 assets"
          git push
