name: OMODOS Superadmin Factory Overview QA

on:
  pull_request:
    branches: [main]
    paths:
      - "public/omodos4/factory-home-superadmin.js"
      - "public/index.html"
      - "public/omodos4/hotfix.js"
      - "public/omodos4/superadmin-intelligence.js"
      - "src/worker.js"
      - "tools/test_logbook_review_fixes.cjs"
      - ".github/workflows/omodos-factory-home-qa.yml"
  push:
    branches: [main]
    paths:
      - "public/omodos4/factory-home-superadmin.js"
      - "public/index.html"
      - "public/omodos4/hotfix.js"
      - "public/omodos4/superadmin-intelligence.js"
      - "src/worker.js"
      - "tools/test_logbook_review_fixes.cjs"
      - ".github/workflows/omodos-factory-home-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check public/omodos4/factory-home-superadmin.js

      - name: Check Logbook review regressions
        run: node tools/test_logbook_review_fixes.cjs

      - name: Check worker JavaScript syntax
        run: node --check src/worker.js

      - name: Validate Superadmin and source-of-truth contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('public/omodos4/factory-home-superadmin.js', 'utf8');
          const hotfix = fs.readFileSync('public/omodos4/hotfix.js', 'utf8');
          assert.ok(hotfix.includes('factory-home-superadmin.js?v=smart-resume-22'), 'mobile layout fix must invalidate the cached Superadmin home script');
          const start = source.indexOf('function latestRecords(){');
          const end = source.indexOf('\nfunction makeStyles(){', start);
          assert.ok(start >= 0 && end > start, 'latestRecords function is present');
          const latest = source.slice(start, end);
          assert.ok(latest.includes('MACHINES'));
          assert.ok(latest.includes('const codeCounts=new Map()'));
          assert.ok(latest.includes("const snapshotCode=code&&codeCounts.get(normalizeKey(code))===1?code:'';"));
          assert.ok(latest.includes('machineLatestStatusSnapshot_({kode:snapshotCode,nama:name})'));
          for (const key of ['kritikal', 'perhatian', 'normal', 'none']) {
            assert.ok(latest.includes(key), 'status severity is mapped: ' + key);
          }
          assert.ok(latest.includes('date,'));
          assert.ok(source.includes("if(!isSuperadmin()||currentMode!=='3d')return"), 'status sync only runs for an authenticated Superadmin in 3D mode');
          assert.ok(source.includes('if(!isSuperadmin()){cleanup();return;}'));
          assert.ok(source.includes('data-ofh-mode="original"'), 'Original homepage toggle is rendered');
          assert.ok(source.includes('data-ofh-mode="3d"'), 'Factory 3D toggle is rendered');
          assert.ok(source.includes('function setHomeMode_(mode,persist)'), 'toggle state controller is present');
          assert.ok(source.includes('function readSavedMode_()'), 'mode preference is restored after login');
          assert.ok(source.includes('localStorage.setItem(modeStorageKey_(),currentMode)'), 'selection is persisted per account');
          assert.ok(source.includes('view.classList.toggle(VIEW_CLASS,show3d)'), 'only 3D mode hides the original home');
          assert.ok(source.includes("frame.removeAttribute('src')"), 'original mode unloads the embedded 3D scene');
          assert.ok(source.includes("type:'OMODOS_FACTORY_STATUS'"));
          assert.ok(source.includes('event.origin!==TWIN_ORIGIN'));
          assert.ok(source.includes('event.source!==iframe.contentWindow'));
          assert.ok(!latest.includes('readEntries('), 'viewer must reuse dashboard status calculations instead of inferring raw Logbook status');
          console.log('OMODOS Superadmin factory viewer contract OK');
          NODE

      - name: Install Playwright Chromium for homepage mode regression
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local OMODOS server for homepage mode regression
        shell: bash
        run: |
          python3 -m http.server 4174 --directory public >/tmp/omodos-home-mode.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omodos-home-mode.log || true
          exit 1

      - name: Test Superadmin Original/3D toggle and per-account preference
        shell: bash
        run: |
          cat > factory-home-mode-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            page.setDefaultTimeout(10000);
            await page.addInitScript(() => {
              localStorage.setItem('omodos.factoryHomeMode.v1.qasuper', 'original');
            });
            await page.goto('http://127.0.0.1:4174/', { waitUntil: 'domcontentloaded', timeout: 20000 });

            await page.evaluate(async () => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa-super';
              const appRoot = document.getElementById('app-root');
              if (appRoot) { appRoot.classList.add('unlocked'); appRoot.classList.remove('dash-mode', 'menu-visible'); }
              const loginGate = document.getElementById('login-gate');
              if (loginGate) loginGate.style.display = 'none';
              const dashboard = document.getElementById('view-dashboard');
              if (dashboard) dashboard.classList.add('active');
              await new Promise((resolve, reject) => {
                if (typeof window.OMODOS_FACTORY_HOME_SYNC === 'function') {
                  window.OMODOS_FACTORY_HOME_SYNC();
                  resolve();
                  return;
                }
                let script = document.querySelector('script[data-omodos-factory-home-script]');
                if (!script) {
                  script = document.createElement('script');
                  script.src = '/omodos4/factory-home-superadmin.js';
                  script.dataset.omodosFactoryHomeScript = '1';
                  script.onload = resolve;
                  script.onerror = () => reject(new Error('factory-home-superadmin.js failed to load'));
                  document.head.appendChild(script);
                } else {
                  script.addEventListener('load', resolve, { once: true });
                  setTimeout(resolve, 1800);
                }
              });
              window.OMODOS_FACTORY_HOME_SYNC?.();
            });
            await page.waitForSelector('#omodos-factory-mode-switch', { timeout: 10000 });

            const originalBefore = await page.evaluate(() => ({
              mode: document.getElementById('omodos-superadmin-factory-home')?.classList.contains('ofh-original-mode'),
              active3d: document.getElementById('view-dashboard')?.classList.contains('omodos-superadmin-factory-home'),
              src: document.querySelector('#omodos-superadmin-factory-home iframe')?.getAttribute('src') ?? null,
              rootDisplay: getComputedStyle(document.getElementById('omodos-superadmin-factory-home')).display,
              statusTitleDisplay: getComputedStyle(document.querySelector('.home-status-title')).display,
              toggleHost: document.getElementById('omodos-factory-mode-switch')?.parentElement?.classList.contains('topbar-title-row'),
              settingsNextToToggle: document.getElementById('btn-open-pengaturan')?.nextElementSibling?.id === 'omodos-factory-mode-switch',
              mobileSwitchLayout: (() => {
                const host = document.querySelector('.topbar-title-row');
                const toggle = document.getElementById('omodos-factory-mode-switch');
                if (!host || !toggle || toggle.parentElement !== host) return null;
                const a = toggle.getBoundingClientRect();
                const overlaps = Array.from(host.children).filter(el => el !== toggle).some(el => {
                  const b = el.getBoundingClientRect();
                  return b.width > 0 && b.height > 0 && a.left < b.right - 0.5 && a.right > b.left + 0.5 && a.top < b.bottom - 0.5 && a.bottom > b.top + 0.5;
                });
                const style = getComputedStyle(host);
                return { hostClass: host.classList.contains('ofh-mode-switch-mobile-host'), display: style.display, flexWrap: style.flexWrap, overlaps, inViewport: a.left >= 0 && a.right <= window.innerWidth + 1 };
              })(),
              gridDisplay: getComputedStyle(document.getElementById('dash-grid')).display,
              pressed: document.querySelector('#omodos-factory-mode-switch [data-ofh-mode="original"]')?.getAttribute('aria-pressed')
            }));
            assert.equal(originalBefore.mode, true, 'saved Original mode should be restored for this Superadmin');
            assert.equal(originalBefore.active3d, false, 'Original mode must not hide the regular homepage');
            assert.equal(originalBefore.src, null, 'Original mode must not load the DigitalTwin iframe');
            assert.equal(originalBefore.rootDisplay, 'none', 'the 3D module must be fully hidden in Original mode');
            assert.notEqual(originalBefore.statusTitleDisplay, 'none', 'the native Status Mesin Sekarang title must remain visible');
            assert.equal(originalBefore.toggleHost, true, 'the compact mode switch must live in the mobile top toolbar');
            assert.equal(originalBefore.settingsNextToToggle, true, 'the mode switch must sit beside the Settings toggle');
            assert.equal(originalBefore.mobileSwitchLayout?.hostClass, true, 'mobile title row should receive scoped no-overlap layout');
            assert.equal(originalBefore.mobileSwitchLayout?.display, 'flex', 'mobile title row should use flexible layout');
            assert.equal(originalBefore.mobileSwitchLayout?.flexWrap, 'wrap', 'mobile title row should wrap on narrow screens');
            assert.equal(originalBefore.mobileSwitchLayout?.overlaps, false, 'the mode switch must not overlap any title-row sibling');
            assert.equal(originalBefore.mobileSwitchLayout?.inViewport, true, 'the mode switch must remain inside the viewport');
            assert.notEqual(originalBefore.gridDisplay, 'none', 'regular machine cards should remain visible');
            assert.equal(originalBefore.pressed, 'true');

            await page.locator('#omodos-factory-mode-switch [data-ofh-mode="3d"]').click();
            const mode3d = await page.evaluate(() => ({
              originalClass: document.getElementById('omodos-superadmin-factory-home')?.classList.contains('ofh-original-mode'),
              active3d: document.getElementById('view-dashboard')?.classList.contains('omodos-superadmin-factory-home'),
              title: document.querySelector('#omodos-superadmin-factory-home h2')?.textContent,
              src: document.querySelector('#omodos-superadmin-factory-home iframe')?.getAttribute('src') ?? null,
              rootDisplay: getComputedStyle(document.getElementById('omodos-superadmin-factory-home')).display,
              gridDisplay: getComputedStyle(document.getElementById('dash-grid')).display,
              pressed: document.querySelector('#omodos-factory-mode-switch [data-ofh-mode="3d"]')?.getAttribute('aria-pressed')
            }));
            assert.equal(mode3d.originalClass, false, '3D mode should remove Original-only layout');
            assert.notEqual(mode3d.rootDisplay, 'none', '3D viewer must be visible in Factory 3D mode');
            assert.equal(mode3d.active3d, true, '3D mode must isolate the factory view');
            assert.equal(mode3d.title, 'Factory Overview');
            assert.equal(mode3d.src, 'https://digitaltwin.offsetbmj.workers.dev/?embed=omodos-status');
            assert.equal(mode3d.gridDisplay, 'none', 'regular machine cards should not leak into 3D mode');
            assert.equal(mode3d.pressed, 'true');

            await page.locator('#omodos-factory-mode-switch [data-ofh-mode="original"]').click();
            const originalAfter = await page.evaluate(() => ({
              mode: document.getElementById('omodos-superadmin-factory-home')?.classList.contains('ofh-original-mode'),
              active3d: document.getElementById('view-dashboard')?.classList.contains('omodos-superadmin-factory-home'),
              src: document.querySelector('#omodos-superadmin-factory-home iframe')?.getAttribute('src') ?? null,
              rootDisplay: getComputedStyle(document.getElementById('omodos-superadmin-factory-home')).display,
              gridDisplay: getComputedStyle(document.getElementById('dash-grid')).display,
              pressed: document.querySelector('#omodos-factory-mode-switch [data-ofh-mode="original"]')?.getAttribute('aria-pressed')
            }));
            assert.equal(originalAfter.mode, true, 'Original mode should be active');
            assert.equal(originalAfter.active3d, false, 'Original mode must restore the ordinary dashboard');
            assert.equal(originalAfter.src, null, 'DigitalTwin iframe should be unloaded in Original mode');
            assert.equal(originalAfter.rootDisplay, 'none', 'the 3D module should be hidden after returning to Original');
            assert.notEqual(originalAfter.gridDisplay, 'none', 'Original status machine cards remain visible');
            assert.equal(originalAfter.pressed, 'true');

            await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-tech', displayName: 'QA Technician', role: 'Technician' };
              window.OMODOS_FACTORY_HOME_SYNC?.();
            });
            await page.waitForFunction(() => !document.getElementById('omodos-superadmin-factory-home'), null, { timeout: 5000 });
            const nonAdmin = await page.evaluate(() => ({
              root: !!document.getElementById('omodos-superadmin-factory-home'),
              toggle: !!document.getElementById('omodos-factory-mode-switch'),
              active3d: document.getElementById('view-dashboard')?.classList.contains('omodos-superadmin-factory-home'),
              gridDisplay: getComputedStyle(document.getElementById('dash-grid')).display
            }));
            assert.equal(nonAdmin.root, false, 'non-Superadmin must not receive the custom home or toggle');
            assert.equal(nonAdmin.toggle, false, 'non-Superadmin must not see Original/3D controls');
            assert.equal(nonAdmin.active3d, false, 'non-Superadmin must retain the regular home');
            assert.notEqual(nonAdmin.gridDisplay, 'none');
            console.log('[HOME_MODE_QA] ' + JSON.stringify({ originalBefore, mode3d, originalAfter, nonAdmin }));
          } finally {
            await browser.close();
          }
          JS
          node --check factory-home-mode-qa.mjs
          timeout -k 5s 45s node factory-home-mode-qa.mjs

      - name: Remove transient homepage QA files
        if: always()
        run: rm -f package.json package-lock.json factory-home-mode-qa.mjs
