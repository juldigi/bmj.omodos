name: OMODOS Patrol and Logbook review patch
on:
  push:
    branches:
      - feat/omodos-patrol-logbook-review
    paths:
      - "tools/apply_patrol_logbook_review.py"
      - "tools/test_patrol_logbook_review.cjs"
      - "public/omodos4/patrol-review-enhancements.js"
      - ".github/workflows/test-patrol-logbook-review.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply additive Worker patch
        run: python tools/apply_patrol_logbook_review.py
      - name: Validate JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/omodos4/patrol-area-feedback.js
          node --check public/omodos4/patrol-review-enhancements.js
      - name: Run focused Patrol and Logbook regression tests
        run: |
          node tools/test_patrol_logbook_review.cjs
          node tools/test_patrol_revisions.cjs
          node tools/test_logbook_downtime_choice.cjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit additive Worker patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          if git diff --cached --quiet; then
            echo "Worker patch already applied."
            exit 0
          fi
          git commit -m "feat: persist Patrol area and checklist notes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
