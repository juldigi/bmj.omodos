name: Extract Patrol file handler source

on:
  push:
    paths:
      - ".github/workflows/extract-patrol-file-handler.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant handlers
        shell: python
        run: |
          from pathlib import Path
          s = Path("public/index.html").read_text(encoding="utf-8")
          anchors = [
            "function renderPatrolFindingFileDrop(){",
            "async function renderPatrolFindingsInputList",
            "function renderPatrolFindingsInputList",
            "$('#patrol-temuan-file-input').addEventListener",
            "PATROL_FINDING_FILES = selectedFiles",
            "function populateWorkAreaOptions_(category,select,value){",
            "async function process",
          ]
          out = []
          for a in anchors:
            i = s.find(a)
            out += ["## " + a, "offset=" + str(i)]
            if i >= 0:
              out += ["```javascript", s[max(0,i-1200):min(len(s),i+8000)], "```"]
            out += [""]
          Path("audit/PATROL_FILE_HANDLER_CONTEXT.md").write_text("\n".join(out), encoding="utf-8")
      - name: Commit handler context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/PATROL_FILE_HANDLER_CONTEXT.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: extract Patrol attachment handlers"
          git push origin HEAD:main
