name: Close temporary OMODOS backup bridge
on:
  push:
    branches:
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/deploy-omodos-export-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c0bf44ff86c9587390f09b6d0bc42dd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated source
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node --check src/migration-export-bridge.js
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.migration-export.jsonc','utf8')); if(c.name!=='omodos-migration-export'||c.durable_objects.bindings[0].script_name!=='omodos')process.exit(1)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).name")" = "omodos"
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund
      - name: Dry run new sibling Worker
        run: npx wrangler deploy --dry-run --config wrangler.migration-export.jsonc --outdir /tmp/omodos-export-dryrun
      - name: Deploy sibling Worker only
        run: npx wrangler deploy --config wrangler.migration-export.jsonc
