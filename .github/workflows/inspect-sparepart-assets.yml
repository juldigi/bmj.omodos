name: Inspect OMODOS sparepart asset archive

on:
  push:
    branches:
      - sparepart-master-photo-price
    paths:
      - .github/workflows/inspect-sparepart-assets.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download authorized Dropbox archive
        run: |
          curl --fail --location --retry 3 \
            'https://www.dropbox.com/scl/fi/nilvvtvmyju2ddk9d83vi/OMODOS_Sparepart_Master_Assets.zip?rlkey=xjmlii9kepdq45mf049xko5s3&dl=1' \
            --output /tmp/sparepart-assets.zip
          test "$(stat -c%s /tmp/sparepart-assets.zip)" -eq 1661921
      - name: Validate ZIP and inspect manifest schema
        run: |
          python - <<'PY'
          import zipfile, pathlib, json
          p = pathlib.Path('/tmp/sparepart-assets.zip')
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              names = [n for n in z.namelist() if not n.endswith('/')]
              atlases = [n for n in names if n.lower().startswith('sparepart-atlas-') and n.lower().endswith(('.jpg','.jpeg','.png','.webp'))]
              if len(atlases) != 19:
                  raise SystemExit(f'Expected 19 atlas images, found {len(atlases)}')
              manifest_name = 'sparepart-master.json'
              if manifest_name not in names:
                  raise SystemExit('sparepart-master.json missing')
              data = json.loads(z.read(manifest_name))
              print('Manifest root type:', type(data).__name__)
              if isinstance(data, dict):
                  print('Manifest root keys:', sorted(data.keys()))
              materials = data.get('materials', []) if isinstance(data, dict) else []
              photos = data.get('photos', []) if isinstance(data, dict) else []
              print('Declared totalMaterials:', data.get('totalMaterials') if isinstance(data, dict) else None)
              print('Materials array:', len(materials))
              print('Photos root type:', type(photos).__name__)
              if isinstance(photos, dict):
                  print('Photos keys:', sorted(photos.keys())[:30])
                  photo_values = list(photos.values())
              elif isinstance(photos, list):
                  print('Photos entries:', len(photos))
                  photo_values = photos
              else:
                  photo_values = []
              print('First photo sample:', str(photo_values[0])[:1200] if photo_values else 'none')
              photo_materials = [m for m in materials if isinstance(m, dict) and any(k in m for k in ('photo','foto','image','atlas','statusFoto'))]
              print('Materials with photo-related fields:', len(photo_materials))
              print('First material sample:', json.dumps(materials[0], ensure_ascii=False)[:1800] if materials else 'none')
              print('First photo-linked material samples:')
              shown = 0
              for material in materials:
                  if isinstance(material, dict) and material.get('statusFoto'):
                      print(json.dumps({k:v for k,v in material.items() if k in ('sap','nama','statusFoto','photo','foto','image','atlas','x','y','width','height')}, ensure_ascii=False)[:1200])
                      shown += 1
                      if shown == 3:
                          break
              if len(materials) != int(data.get('totalMaterials', len(materials))):
                  raise SystemExit('totalMaterials does not match materials array')
              if not materials:
                  raise SystemExit('Materials array is empty')
              pathlib.Path('/tmp/archive-inventory.txt').write_text(
                  '\\n'.join(names) + '\\n', encoding='utf-8')
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: omodos-sparepart-asset-inventory
          path: /tmp/archive-inventory.txt
          if-no-files-found: error
