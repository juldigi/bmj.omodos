name: Inspect OMODOS sparepart asset archive

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/inspect-sparepart-assets.yml
      - public/omodos4/sparepart-assets/manifest.json
  push:
    branches:
      - sparepart-master-photo-price
    paths:
      - .github/workflows/inspect-sparepart-assets.yml
      - public/omodos4/sparepart-assets/manifest.json

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Download authorized Dropbox archive
        run: |
          curl --fail --location --retry 3 \
            'https://www.dropbox.com/scl/fi/nilvvtvmyju2ddk9d83vi/OMODOS_Sparepart_Master_Assets.zip?rlkey=xjmlii9kepdq45mf049xko5s3&dl=1' \
            --output /tmp/sparepart-assets.zip
          test "$(stat -c%s /tmp/sparepart-assets.zip)" -eq 1661921
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate ZIP and inspect manifest schema
        run: |
          python - <<'PY'
          import zipfile, pathlib, json, hashlib
          from PIL import Image, ImageOps, ImageDraw
          p = pathlib.Path('/tmp/sparepart-assets.zip')
          out = pathlib.Path('/tmp/atlas-review')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              names = [n for n in z.namelist() if not n.endswith('/')]
              atlases = sorted(n for n in names if n.lower().startswith('sparepart-atlas-') and n.lower().endswith(('.jpg','.jpeg','.png','.webp')))
              if len(atlases) != 19:
                  raise SystemExit(f'Expected 19 atlas images, found {len(atlases)}')
              manifest_name = 'sparepart-master.json'
              if manifest_name not in names:
                  raise SystemExit('sparepart-master.json missing')
              data = json.loads(z.read(manifest_name))
              materials = data.get('materials', []) if isinstance(data, dict) else []
              photos = data.get('photos', []) if isinstance(data, dict) else []
              print('Manifest root keys:', sorted(data.keys()) if isinstance(data, dict) else [])
              print('Declared totalMaterials:', data.get('totalMaterials') if isinstance(data, dict) else None)
              print('Materials array:', len(materials))
              print('Photos root type/value:', type(photos).__name__, repr(photos)[:300])
              print('Material sample:', json.dumps(materials[0], ensure_ascii=False)[:1800] if materials else 'none')
              if len(materials) != int(data.get('totalMaterials', len(materials))) or not materials:
                  raise SystemExit('Material count validation failed')
              thumbs = []
              report = []
              atlas_sizes = {}
              for name in atlases:
                  raw = z.read(name)
                  dest = out / pathlib.Path(name).name
                  dest.write_bytes(raw)
                  im = Image.open(dest).convert('RGB')
                  atlas_sizes[dest.name] = (im.width, im.height)
                  print(f'ATLAS {dest.name}: {im.width}x{im.height}, sha256={hashlib.sha256(raw).hexdigest()}')
                  thumb = ImageOps.contain(im, (420, 300))
                  tile = Image.new('RGB', (440, 340), 'white')
                  tile.paste(thumb, ((440-thumb.width)//2, 28))
                  ImageDraw.Draw(tile).text((12, 8), f'{dest.name} · {im.width}x{im.height}', fill='black')
                  thumbs.append(tile)
                  report.append(f'{dest.name}\t{im.width}x{im.height}\t{hashlib.sha256(raw).hexdigest()}')
              seen = set()
              for row in materials:
                  sap = str(row.get('sap') or '').strip()
                  if not sap or sap in seen:
                      raise SystemExit(f'Missing or duplicate SAP key: {sap!r}')
                  seen.add(sap)
                  # The source archive stores photo coordinates directly on each row;
                  # accept nested foto objects too, but never infer from row order.
                  photo = row.get('foto') or (row if row.get('atlas') else None)
                  if not photo:
                      continue
                  atlas = photo.get('atlas')
                  x, y = photo.get('x'), photo.get('y')
                  w, h = photo.get('width'), photo.get('height')
                  if atlas not in atlas_sizes or not all(isinstance(v, int) for v in (x,y,w,h)) or w <= 0 or h <= 0:
                      raise SystemExit(f'Invalid photo mapping for SAP {sap}: {photo}')
                  aw, ah = atlas_sizes[atlas]
                  if x < 0 or y < 0 or x+w > aw or y+h > ah:
                      raise SystemExit(f'Crop outside atlas bounds for SAP {sap}: {photo}, atlas={aw}x{ah}')
                  if (w,h) != (120,80):
                      raise SystemExit(f'Unexpected crop size for SAP {sap}: {w}x{h}')
              print(f'Validated {len(seen)} unique SAP keys and {sum(1 for m in materials if m.get("foto") or m.get("atlas"))} photo crops.')
              mapped_count = sum(1 for m in materials if m.get('foto') or m.get('atlas'))
              if not isinstance(photos, int) or photos != mapped_count:
                  print(f'WARNING: root photos value {photos!r} differs from mapped rows ({mapped_count}); row mappings are authoritative.')
              cols = 3
              rows = (len(thumbs)+cols-1)//cols
              sheet = Image.new('RGB', (cols*440, rows*340), '#d9dee5')
              for i, tile in enumerate(thumbs):
                  sheet.paste(tile, ((i%cols)*440, (i//cols)*340))
              sheet.save(out/'atlas-contact-sheet.jpg', quality=88)
              (out/'atlas-inventory.tsv').write_text('\n'.join(report)+'\n', encoding='utf-8')
          PY
      - name: Publish validated atlas files to PR branch
        shell: bash
        run: |
          set -euo pipefail
          target="public/omodos4/sparepart-assets/atlases"
          mkdir -p "$target"
          unzip -j /tmp/sparepart-assets.zip 'sparepart-atlas-*.jpg' -d "$target"
          test "$(find "$target" -maxdepth 1 -type f -name 'sparepart-atlas-*.jpg' | wc -l)" -eq 19
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "Atlas assets already current; no commit needed."
          else
            git commit -m "assets: publish validated sparepart atlases"
            target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            git push origin "HEAD:$target_branch"
          fi
      - name: Upload atlas review package
        uses: actions/upload-artifact@v4
        with:
          name: omodos-sparepart-atlas-review
          path: /tmp/atlas-review/
          if-no-files-found: error

# Re-run atlas inspection after source archive was verified in Dropbox.
