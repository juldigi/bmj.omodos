name: Inspect OMODOS sparepart asset archive

on:
  push:
    branches:
      - sparepart-master-photo-price
    paths:
      - .github/workflows/inspect-sparepart-assets.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download authorized Dropbox archive
        run: |
          curl --fail --location --retry 3 \
            'https://www.dropbox.com/scl/fi/nilvvtvmyju2ddk9d83vi/OMODOS_Sparepart_Master_Assets.zip?rlkey=xjmlii9kepdq45mf049xko5s3&dl=1' \
            --output /tmp/sparepart-assets.zip
          test "$(stat -c%s /tmp/sparepart-assets.zip)" -eq 1661921
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate ZIP and inspect manifest schema
        run: |
          python - <<'PY'
          import zipfile, pathlib, json, hashlib
          from PIL import Image, ImageOps, ImageDraw
          p = pathlib.Path('/tmp/sparepart-assets.zip')
          out = pathlib.Path('/tmp/atlas-review')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              names = [n for n in z.namelist() if not n.endswith('/')]
              atlases = sorted(n for n in names if n.lower().startswith('sparepart-atlas-') and n.lower().endswith(('.jpg','.jpeg','.png','.webp')))
              if len(atlases) != 19:
                  raise SystemExit(f'Expected 19 atlas images, found {len(atlases)}')
              manifest_name = 'sparepart-master.json'
              if manifest_name not in names:
                  raise SystemExit('sparepart-master.json missing')
              data = json.loads(z.read(manifest_name))
              materials = data.get('materials', []) if isinstance(data, dict) else []
              photos = data.get('photos', []) if isinstance(data, dict) else []
              print('Manifest root keys:', sorted(data.keys()) if isinstance(data, dict) else [])
              print('Declared totalMaterials:', data.get('totalMaterials') if isinstance(data, dict) else None)
              print('Materials array:', len(materials))
              print('Photos root type/value:', type(photos).__name__, repr(photos)[:300])
              print('Material sample:', json.dumps(materials[0], ensure_ascii=False)[:1800] if materials else 'none')
              if len(materials) != int(data.get('totalMaterials', len(materials))) or not materials:
                  raise SystemExit('Material count validation failed')
              thumbs = []
              report = []
              for name in atlases:
                  raw = z.read(name)
                  dest = out / pathlib.Path(name).name
                  dest.write_bytes(raw)
                  im = Image.open(dest).convert('RGB')
                  print(f'ATLAS {dest.name}: {im.width}x{im.height}, sha256={hashlib.sha256(raw).hexdigest()}')
                  thumb = ImageOps.contain(im, (420, 300))
                  tile = Image.new('RGB', (440, 340), 'white')
                  tile.paste(thumb, ((440-thumb.width)//2, 28))
                  ImageDraw.Draw(tile).text((12, 8), f'{dest.name} · {im.width}x{im.height}', fill='black')
                  thumbs.append(tile)
                  report.append(f'{dest.name}\t{im.width}x{im.height}\t{hashlib.sha256(raw).hexdigest()}')
              cols = 3
              rows = (len(thumbs)+cols-1)//cols
              sheet = Image.new('RGB', (cols*440, rows*340), '#d9dee5')
              for i, tile in enumerate(thumbs):
                  sheet.paste(tile, ((i%cols)*440, (i//cols)*340))
              sheet.save(out/'atlas-contact-sheet.jpg', quality=88)
              (out/'atlas-inventory.tsv').write_text('\n'.join(report)+'\n', encoding='utf-8')
          PY
      - name: Upload atlas review package
        uses: actions/upload-artifact@v4
        with:
          name: omodos-sparepart-atlas-review
          path: /tmp/atlas-review/
          if-no-files-found: error
