name: Inspect OMODOS sparepart asset archive

on:
  push:
    branches:
      - sparepart-master-photo-price
    paths:
      - .github/workflows/inspect-sparepart-assets.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download authorized Dropbox archive
        run: |
          curl --fail --location --retry 3 \
            'https://www.dropbox.com/scl/fi/nilvvtvmyju2ddk9d83vi/OMODOS_Sparepart_Master_Assets.zip?rlkey=xjmlii9kepdq45mf049xko5s3&dl=1' \
            --output /tmp/sparepart-assets.zip
          test "$(stat -c%s /tmp/sparepart-assets.zip)" -eq 1661921
      - name: Validate ZIP, atlas files and material manifest
        run: |
          python - <<'PY'
          import zipfile, pathlib, json, re
          p = pathlib.Path('/tmp/sparepart-assets.zip')
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              names = [n for n in z.namelist() if not n.endswith('/')]
              atlases = [n for n in names if re.search(r'atlas[-_ ]?\\d+\\.(jpg|jpeg|png|webp)$', n, re.I)]
              json_files = [n for n in names if n.lower().endswith('.json')]
              print('Archive members:')
              for n in names:
                  print(f'  {n} ({z.getinfo(n).file_size} bytes)')
              if len(atlases) != 19:
                  raise SystemExit(f'Expected 19 atlas images, found {len(atlases)}')
              if not json_files:
                  raise SystemExit('No JSON material manifest found')
              valid_manifest = False
              for n in json_files:
                  data = json.loads(z.read(n))
                  rows = data if isinstance(data, list) else next(
                      (data[k] for k in ('materials','items','data','spareparts') if isinstance(data,dict) and isinstance(data.get(k),list)), None)
                  if rows is None:
                      continue
                  print(f'Manifest {n}: {len(rows)} records')
                  if len(rows) != 2442:
                      raise SystemExit(f'Expected 2442 material records in {n}, found {len(rows)}')
                  sample = rows[0] if rows else {}
                  print('First record fields:', sorted(sample.keys()) if isinstance(sample,dict) else type(sample).__name__)
                  valid_manifest = True
              if not valid_manifest:
                  raise SystemExit('JSON files found, but no 2442-row material array was recognized')
              pathlib.Path('/tmp/archive-inventory.txt').write_text(
                  '\\n'.join(names) + '\\n', encoding='utf-8')
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: omodos-sparepart-asset-inventory
          path: /tmp/archive-inventory.txt
          if-no-files-found: error
