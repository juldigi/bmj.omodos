name: Extract Logbook and Access Integration

on:
  push:
    branches:
      - audit/deep-production-regression
    paths:
      - ".github/workflows/extract-logbook-access.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact integration anchors
        shell: python
        run: |
          from pathlib import Path
          import re

          src=Path("public/index.html").read_text(encoding="utf-8",errors="replace")
          lines=src.splitlines()

          patterns=[
            'id="filter-status"',
            'id="filter-group"',
            "filter-status",
            "filter-group",
            "renderLogbook",
            "applyLogbook",
            "filterLogbook",
            "renderViewLogbook",
            "User Management",
            "Role Access",
            "Role Access Management",
            "User & Akses",
            "user-management",
            "role-access",
            "copilot-actions",
            "copilot-clear-data",
          ]

          # Deduplicate nearby hits so the report stays compact.
          sections=[]
          used=[]
          for term in patterns:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            for idx in hits[:12]:
              if any(abs(idx-u)<18 for u in used):
                continue
              used.append(idx)
              start=max(0,idx-18); end=min(len(lines),idx+40)
              sections.append((term,idx+1,start,end))

          out=["# Logbook + Access Integration Anchors",""]
          for term,ln,start,end in sections:
            out.append(f"## {term} @ L{ln}")
            out.append("~~~text")
            for j in range(start,end):
              line=lines[j]
              if len(line)>1000: line=line[:1000]+"…"
              out.append(f"{j+1:05d}: {line}")
            out.append("~~~")
            out.append("")

          Path("audit").mkdir(exist_ok=True)
          Path("audit/LOGBOOK_ACCESS_ANCHORS.md").write_text("\n".join(out)+"\n",encoding="utf-8")

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/LOGBOOK_ACCESS_ANCHORS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: extract logbook and access integration anchors"
          git push
