name: Browser QA OMODOS 4 Master Recovery
# QA trigger after V4 script relocation

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/browser-qa-v4.yml"
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/browser-qa-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate OMODOS 4 Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js

          ! grep -Fq 'recurring.set(lower(d), (recurring.get(lower(d)) || { label: d, count: 0 }).count + 1)' src/worker.js
          grep -Fq 'const cur = recurring.get(k) || { label: d, count: 0 };' src/worker.js
          grep -Fq 'cur.count++;' src/worker.js

          grep -Fq 'const y = num(year), m = monthNumber(month);' src/worker.js

          grep -Fq 'machineMaster.forEach((r) =>' src/worker.js
          grep -Fq 'if (!machineCoverage.has(key)) machineCoverage.set(key' src/worker.js
          grep -Fq 'p.gaps.length > 0 || p.notCompetent > 0' src/worker.js

          grep -Fq 'function improvementMentionsMachine(record, machine)' src/worker.js
          ! grep -Fq 'existingText.includes(key)' src/worker.js

          grep -Fq 'const SOURCE_TRUTH_START_MS = Date.parse(SOURCE_TRUTH_START_ISO);' src/worker.js
          grep -Fq 'return data.filter((r) => sourceTimestamp(r) >= SOURCE_TRUTH_START_MS);' src/worker.js

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate Worker JavaScript
        run: node --check src/worker.js

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory public >/tmp/omodos-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omodos-http.log || true
          exit 1

      - name: Run V4 browser regression checks
        shell: bash
        run: |
          cat > v4-qa.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const result = { phases: [] };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(10000);

            page.on('pageerror', e => errors.push(String(e)));
            page.on('dialog', async d => {
              console.log('[QA_DIALOG] ' + d.type() + ': ' + d.message());
              try { await d.dismiss(); } catch {}
            });
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const t = msg.text();
                if (!/Failed to load resource|ERR_CONNECTION|fetch|network/i.test(t)) {
                  errors.push('console: ' + t);
                }
              }
            });

            console.log('[QA] open');
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 15000
            });
            result.phases.push('open');

            console.log('[QA] structural');
            const structural = await page.evaluate(() => ({
              nav: !!document.getElementById('v4-nav-group'),
              view: !!document.getElementById('view-omodos4'),
              ns: !!window.OMODOS4,
              render: typeof window.renderOmodos4 === 'function',
              gate: typeof canAccessView_ === 'function',
              rbac: typeof applyRbacToUi === 'function'
            }));
            result.structural = structural;
            if (!Object.values(structural).every(Boolean)) {
              throw new Error('V4 structural check failed: ' + JSON.stringify(structural));
            }
            result.phases.push('structural');

            console.log('[QA] non-superadmin');
            const admin = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-admin', displayName: 'QA Admin', role: 'Admin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();

              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              const active = document.getElementById('view-omodos4').classList.contains('active');
              return { allowed, display, go, active };
            });
            result.admin = admin;
            if (admin.allowed !== false || admin.display !== 'none' || admin.go !== false || admin.active !== false) {
              throw new Error('Non-Superadmin gate failed: ' + JSON.stringify(admin));
            }
            result.phases.push('non-superadmin');

            console.log('[QA] superadmin');
            const sup = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();

              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              const active = document.getElementById('view-omodos4').classList.contains('active');
              const cards = document.querySelectorAll('#v4-summary .v4-card').length;
              return { allowed, display, go, active, cards };
            });
            result.superadmin = sup;
            if (sup.allowed !== true || sup.display === 'none' || sup.go !== true || sup.active !== true || sup.cards !== 6) {
              throw new Error('Superadmin V4 access failed: ' + JSON.stringify(sup));
            }
            result.phases.push('superadmin');

            console.log('[QA] frontend recovery + UI safety');
            await page.evaluate(() => window.dispatchEvent(new Event('storage')));
            await page.waitForTimeout(100);
            const uiSafety = await page.evaluate(() => {
              const v4 = document.getElementById('v4-nav-group');
              const help = document.getElementById('copilot-help');
              const helpInside = !!help?.closest('#copilot-panel');
              const helpOutside = [...document.querySelectorAll('#copilot-help')].some(x => !x.closest('#copilot-panel'));
              const filterMachine = !!document.getElementById('filter-machine');
              const recoveredModules = document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length;

              try { toast('QA toast layer'); } catch {}
              const toastEl = document.querySelector('.toast');
              const copilot = document.getElementById('copilot-panel');
              const toastStyle = toastEl ? getComputedStyle(toastEl) : null;
              const copilotStyle = copilot ? getComputedStyle(copilot) : null;
              const toastZ = Number.parseInt(toastStyle?.zIndex || '0', 10) || 0;
              const copilotZ = Number.parseInt(copilotStyle?.zIndex || '0', 10) || 0;

              return {
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules,
                helpInside,
                helpOutside,
                filterMachine,
                toastZ,
                copilotZ,
                toastTop: toastStyle?.top || '',
                toastBottom: toastStyle?.bottom || ''
              };
            });
            result.uiSafety = uiSafety;
            const toastTopPx = Number.parseFloat(uiSafety.toastTop);
            if (!uiSafety.authorizedClass || uiSafety.recoveredModules < 10 || !uiSafety.helpInside || uiSafety.helpOutside || !uiSafety.filterMachine || uiSafety.toastZ <= uiSafety.copilotZ || !Number.isFinite(toastTopPx) || toastTopPx < 0 || toastTopPx > 40) {
              throw new Error('Frontend recovery/UI safety failed: ' + JSON.stringify(uiSafety));
            }
            result.phases.push('ui-safety');

            console.log('[QA] non-superadmin recovered menu fail-closed');
            const recoveredDeny = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-tech', displayName: 'QA Tech', role: 'Tech' };
              PERMISSIONS = {};
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
              const v4 = document.getElementById('v4-nav-group');
              return {
                allowed: canAccessView_('omodos4'),
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules: document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length
              };
            });
            result.recoveredDeny = recoveredDeny;
            if (recoveredDeny.allowed !== false || recoveredDeny.authorizedClass !== false || recoveredDeny.recoveredModules !== 0) {
              throw new Error('Recovered V4 fail-closed check failed: ' + JSON.stringify(recoveredDeny));
            }
            result.phases.push('recovered-deny');

            console.log('[QA] source-truth machine selectors');
            const sourceTruthMachineNames = await page.evaluate(() => {
              const oldEntries = ENTRIES;
              const oldMachines = MACHINES;
              const oldPatrol = PM_REPORTS;
              try {
                MACHINES = [{ 'Kode Mesin':'QA-MASTER', 'Nama Mesin':'QA Master Current' }];
                ENTRIES = [
                  { 'Nama Mesin':'QA Old Logbook', 'Tanggal':'2026-08-31', 'Timestamp Input':'2026-08-31T08:00:00+07:00' },
                  { 'Nama Mesin':'QA New Logbook', 'Tanggal':'2026-09-02', 'Timestamp Input':'2026-09-02T08:00:00+07:00' }
                ];
                PM_REPORTS = [
                  { 'Nama Mesin':'QA Old Patrol', 'Tanggal':'2026-08-20' },
                  { 'Nama Mesin':'QA New Patrol', 'Tanggal':'2026-09-03' }
                ];
                return window.OMODOS4.getMachineNames();
              } finally {
                ENTRIES = oldEntries;
                MACHINES = oldMachines;
                PM_REPORTS = oldPatrol;
              }
            });
            result.sourceTruthMachineNames = sourceTruthMachineNames;
            if (!sourceTruthMachineNames.includes('QA Master Current') ||
                !sourceTruthMachineNames.includes('QA New Logbook') ||
                !sourceTruthMachineNames.includes('QA New Patrol') ||
                sourceTruthMachineNames.includes('QA Old Logbook') ||
                sourceTruthMachineNames.includes('QA Old Patrol')) {
              throw new Error('V4 machine selector cutoff failed: ' + JSON.stringify(sourceTruthMachineNames));
            }
            result.phases.push('source-truth-machine-selectors');

            console.log('[QA] physical OMODOS 4 sidebar module clicks');
            await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              const app=document.getElementById('app-root');
              const gate=document.getElementById('login-gate');
              if(app) app.classList.add('unlocked');
              if(gate) gate.style.display='none';
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
            });
            await page.waitForTimeout(100);

            const v4Parent = page.locator('#v4-nav-group .nav-parent-btn[data-group="omodos4"]');
            const v4Submenu = page.locator('#v4-nav-group [data-submenu="omodos4"]');
            if (!(await v4Submenu.evaluate(el => el.classList.contains('open')))) {
              await v4Parent.click();
              await page.waitForTimeout(40);
            }

            const physicalModules = page.locator('#v4-nav-group [data-v4-safe-module]');
            const physicalCount = await physicalModules.count();
            const sidebarClickQA = { moduleCount: physicalCount, failures: [], modules: [] };
            for (let i = 0; i < physicalCount; i++) {
              await page.evaluate(() => {
                try { if(typeof goToView === 'function') goToView('omodos4'); } catch {}
                const app=document.getElementById('app-root');
                const sidebar=document.querySelector('.sidebar');
                if(app){
                  app.classList.remove('dash-mode');
                  app.classList.add('sidebar-drawer-open','menu-visible');
                }
                if(sidebar) sidebar.classList.add('open');
                const sub=document.querySelector('#v4-nav-group [data-submenu="omodos4"]');
                const parent=document.querySelector('#v4-nav-group .nav-parent-btn[data-group="omodos4"]');
                if(sub){sub.classList.add('open');sub.style.maxHeight='none';sub.style.overflow='visible';}
                if(parent) parent.classList.add('open');
              });
              await page.waitForTimeout(15);
              const btn = physicalModules.nth(i);
              const name = (await btn.getAttribute('aria-label')) || ('module-' + i);
              try {
                console.log('[QA] sidebar module:', name);
                await btn.click({timeout:1500});
                await page.waitForTimeout(40);
                const state = await page.evaluate((expectedName) => {
                  const view = document.getElementById('view-omodos4');
                  const stage = document.getElementById('v4-safe-stage');
                  const heading = stage?.querySelector('h2')?.textContent?.trim() || '';
                  const tiles = stage?.querySelectorAll('[data-v4-route]').length || 0;
                  const rect = stage?.getBoundingClientRect();
                  const activeBtn = document.querySelector('#v4-nav-group [data-v4-safe-module].active');
                  return {
                    viewActive: !!view?.classList.contains('active'),
                    moduleMode: !!view?.classList.contains('v4-safe-module-open'),
                    heading,
                    tiles,
                    stageVisible: !!stage && getComputedStyle(stage).display !== 'none',
                    stageInViewport: !!rect && rect.top >= -5 && rect.top < window.innerHeight,
                    activeLabel: activeBtn?.getAttribute('aria-label') || '',
                    expectedName
                  };
                }, name);
                sidebarClickQA.modules.push(state);
                if (!state.viewActive || !state.moduleMode || !state.stageVisible || !state.stageInViewport ||
                    state.tiles !== 10 || state.activeLabel !== name || !state.heading.includes(name)) {
                  sidebarClickQA.failures.push(state);
                }
              } catch (e) {
                sidebarClickQA.failures.push({ expectedName:name, thrown:String(e && e.message || e) });
              }
            }

            await page.evaluate(() => document.querySelector('#v4-nav-group [data-v4-root]')?.click());
            await page.waitForTimeout(50);
            sidebarClickQA.commandCenter = await page.evaluate(() => {
              const view = document.getElementById('view-omodos4');
              const stage = document.getElementById('v4-safe-stage');
              const hero = view?.querySelector('.v4-hero');
              const root = document.querySelector('#v4-nav-group [data-v4-root]');
              return {
                viewActive: !!view?.classList.contains('active'),
                moduleMode: !!view?.classList.contains('v4-safe-module-open'),
                stageHidden: !stage || getComputedStyle(stage).display === 'none',
                heroVisible: !!hero && getComputedStyle(hero).display !== 'none',
                rootActive: !!root?.classList.contains('active')
              };
            });
            result.sidebarClickQA = sidebarClickQA;
            if (sidebarClickQA.moduleCount !== 10 || sidebarClickQA.failures.length ||
                !sidebarClickQA.commandCenter.viewActive || sidebarClickQA.commandCenter.moduleMode ||
                !sidebarClickQA.commandCenter.stageHidden || !sidebarClickQA.commandCenter.heroVisible ||
                !sidebarClickQA.commandCenter.rootActive) {
              throw new Error('Physical OMODOS 4 sidebar click QA failed: ' + JSON.stringify(sidebarClickQA));
            }
            result.phases.push('v4-sidebar-physical-clicks');

            console.log('[QA] recovered module route completeness');
            await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              PERMISSIONS = {};
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
            });
            await page.waitForTimeout(80);

            const moduleCount = await page.locator('#v4-nav-group [data-v4-safe-module]').count();
            const routeAudit = { moduleCount, tileCount: 0, emptyRoutes: [], invalidTargets: [] };
            for (let i = 0; i < moduleCount; i++) {
              const module = page.locator('#v4-nav-group [data-v4-safe-module]').nth(i);
              const moduleName = (await module.getAttribute('aria-label')) || ('module-' + i);
              await module.evaluate(el => el.click());
              await page.waitForTimeout(30);

              const tiles = page.locator('#v4-safe-stage [data-v4-route]');
              const count = await tiles.count();
              routeAudit.tileCount += count;
              for (let j = 0; j < count; j++) {
                const tile = tiles.nth(j);
                const route = (await tile.getAttribute('data-v4-route')) || '';
                const label = ((await tile.locator('strong').textContent()) || '').trim();
                if (!route) {
                  routeAudit.emptyRoutes.push(moduleName + ' > ' + label);
                  continue;
                }
                if (route === '@copilot') {
                  const ok = await page.locator('#copilot-fab').count();
                  if (!ok) routeAudit.invalidTargets.push(label + ' -> ' + route);
                  continue;
                }
                if (route === '@copilot-help') {
                  const ok = await page.locator('#copilot-fab').count() && await page.locator('#copilot-help').count();
                  if (!ok) routeAudit.invalidTargets.push(label + ' -> ' + route);
                  continue;
                }
                const exists = await page.locator('#view-' + route).count();
                if (!exists) routeAudit.invalidTargets.push(label + ' -> ' + route);
              }
            }
            result.routeAudit = routeAudit;
            if (routeAudit.moduleCount !== 10 || routeAudit.tileCount !== 100 || routeAudit.emptyRoutes.length || routeAudit.invalidTargets.length) {
              throw new Error('Recovered module routing audit failed: ' + JSON.stringify(routeAudit));
            }
            result.phases.push('route-completeness');

            console.log('[QA] all 100 OMODOS 4 feature clicks');
            const featureClickQA = { checked: 0, failures: [] };
            for (let i = 0; i < moduleCount; i++) {
              const module = page.locator('#v4-nav-group [data-v4-safe-module]').nth(i);
              for (let j = 0; j < 10; j++) {
                const beforeErr = errors.length;
                try {
                  await module.evaluate(el => el.click());
                  await page.waitForTimeout(20);
                  const tile = page.locator('#v4-safe-stage [data-v4-feature]').nth(j);
                  const featureNo = Number(await tile.getAttribute('data-v4-feature'));
                  const featureLabel = ((await tile.locator('strong').textContent()) || '').trim();
                  await tile.evaluate(el => el.click());
                  await page.waitForTimeout(35);
                  const state = await page.evaluate(({expected, featureNo}) => {
                    const view = document.getElementById('view-omodos4');
                    const stage = document.getElementById('v4-safe-stage');
                    const heading = stage?.querySelector('.v4-detail-card .v4-module-head h2')?.textContent?.trim() || '';
                    let selector = '';
                    if (featureNo <= 20) selector = '[data-v4-mp-feature="' + featureNo + '"]';
                    else if (featureNo <= 30) selector = '[data-v4-sf-feature="' + featureNo + '"]';
                    else if (featureNo <= 40) selector = '[data-v4-sp-feature="' + featureNo + '"]';
                    else if (featureNo <= 50) selector = '[data-v4-rel-feature="' + featureNo + '"]';
                    else if (featureNo <= 60) selector = '[data-v4-op-feature="' + featureNo + '"]';
                    else if (featureNo <= 70) selector = '[data-v4-pi-feature="' + featureNo + '"]';
                    else if (featureNo <= 80) selector = '[data-v4-ai2-feature="' + featureNo + '"]';
                    else if (featureNo <= 90) selector = '[data-v4-imp-feature="' + featureNo + '"]';
                    else if (featureNo === 97 || featureNo === 98) selector = '[data-v4-interaction-feature="' + featureNo + '"]';
                    else selector = '[data-v4-fb-feature="' + featureNo + '"]';
                    const body = stage?.querySelector('.v4-detail-card .v4-detail-body');
                    return {
                      active: !!view?.classList.contains('active'),
                      featureOpen: !!view?.classList.contains('v4-feature-open'),
                      heading,
                      detail: !!stage?.querySelector('.v4-detail-card'),
                      detailBodyHasContent: !!body?.textContent?.trim(),
                      dedicatedPanelCount: selector ? (stage?.querySelectorAll(selector).length || 0) : 0,
                      serverPanelCount: stage?.querySelectorAll('#v4-server-intel').length || 0,
                      expected
                    };
                  }, {expected: featureLabel, featureNo});
                  const newErrors = errors.slice(beforeErr).filter(x =>
                    !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError|Failed to load resource/i.test(x)
                  );
                  featureClickQA.checked++;
                  if (!featureNo || !state.active || !state.featureOpen || !state.detail ||
                      !state.detailBodyHasContent || state.dedicatedPanelCount !== 1 ||
                      state.heading !== featureLabel || state.serverPanelCount > 1 ||
                      newErrors.some(x => /TypeError|ReferenceError|SyntaxError|insertBefore/i.test(x))) {
                    featureClickQA.failures.push({ featureNo, featureLabel, state, errors: newErrors.slice(0, 5) });
                  }
                } catch (e) {
                  featureClickQA.failures.push({ module: i + 1, index: j, thrown: String(e && e.stack || e) });
                }
              }
            }
            result.featureClickQA = featureClickQA;
            if (featureClickQA.checked !== 100 || featureClickQA.failures.length) {
              throw new Error('OMODOS 4 feature click regression failed: ' + JSON.stringify(featureClickQA.failures.slice(0, 12)));
            }
            result.phases.push('all-100-feature-clicks');

            console.log('[QA] KPI target simulator is distinct from maintenance scenario');
            await page.evaluate(() => {
              const module = document.querySelector('#v4-nav-group [data-v4-safe-module="6"]');
              if (module) module.click();
            });
            await page.waitForTimeout(30);
            const kpiTargetTile = page.locator('#v4-safe-stage [data-v4-feature="54"]');
            await kpiTargetTile.evaluate(el => el.click());
            await page.waitForTimeout(50);
            const kpiTargetQA = await page.evaluate(() => ({
              kpiSelect: !!document.querySelector('[data-v4-op-kpi]'),
              scenarioValue: !!document.querySelector('[data-v4-op-kpi-value]'),
              compareButton: !!document.querySelector('[data-v4-op-kpi-sim]'),
              oldDowntimeControl: !!document.querySelector('[data-v4-op-down]'),
              oldRecurringControl: !!document.querySelector('[data-v4-op-rec]'),
              oldStockControl: !!document.querySelector('[data-v4-op-stock]'),
              oldActionControl: !!document.querySelector('[data-v4-op-close]')
            }));
            result.kpiTargetQA = kpiTargetQA;
            if (!kpiTargetQA.kpiSelect || !kpiTargetQA.scenarioValue || !kpiTargetQA.compareButton ||
                kpiTargetQA.oldDowntimeControl || kpiTargetQA.oldRecurringControl ||
                kpiTargetQA.oldStockControl || kpiTargetQA.oldActionControl) {
              throw new Error('KPI target simulator still overlaps maintenance scenario: ' + JSON.stringify(kpiTargetQA));
            }
            result.phases.push('kpi-target-simulator-distinct');

            console.log('[QA] all application views');
            const viewInventory = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();
              const targets = [...new Set([...document.querySelectorAll('[data-view]')].map(x => String(x.dataset.view || '').trim()).filter(Boolean))].sort();
              const domViews = [...document.querySelectorAll('[id^="view-"]')].map(x => x.id.slice(5)).sort();
              const missingDom = targets.filter(v => !document.getElementById('view-' + v));
              const allViews = [...new Set([...targets, ...domViews])].sort();
              return { targets, domViews, allViews, missingDom };
            });
            result.viewInventory = viewInventory;
            if (viewInventory.missingDom.length) {
              throw new Error('Navigation target without DOM view: ' + JSON.stringify(viewInventory.missingDom));
            }

            const viewFailures = [];
            for (const view of viewInventory.allViews) {
              const beforeErr = errors.length;
              const state = await page.evaluate(v => {
                try {
                  const ok = typeof goToView === 'function' ? goToView(v) : switchToView(v);
                  const el = document.getElementById('view-' + v);
                  return { ok, active: !!el?.classList.contains('active') };
                } catch (e) {
                  return { ok: false, active: false, thrown: String(e && e.stack || e) };
                }
              }, view);
              await page.waitForTimeout(25);
              const newErrors = errors.slice(beforeErr).filter(x => !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError|Failed to load resource/i.test(x));
              if (state.ok === false || !state.active || state.thrown || newErrors.some(x => /TypeError|ReferenceError|SyntaxError/i.test(x))) {
                viewFailures.push({ view, state, errors: newErrors.slice(0, 4) });
              }
            }
            result.viewFailures = viewFailures;
            if (viewFailures.length) {
              throw new Error('Application view navigation/render failures: ' + JSON.stringify(viewFailures.slice(0, 12)));
            }
            result.phases.push('all-views');

            console.log('[QA] critical view controls');
            const critical = await page.evaluate(() => {
              const out = {};
              const open = v => { try { goToView(v); } catch {} };

              open('utama');
              out.logbook = {
                view: !!document.getElementById('view-utama'),
                machineDropdown: !!document.getElementById('filter-machine'),
                paginationTarget: !!document.getElementById('list-utama')
              };

              open('patrol');
              const patrol = document.getElementById('view-patrol');
              out.patrol = {
                view: !!patrol,
                controls: patrol ? patrol.querySelectorAll('button,select,input,textarea').length : 0
              };

              open('sparepart');
              out.sparepart = {
