            if(personilMediaQA.calls?.length!==2 ||
               personilMediaQA.calls?.[0]?.action!=='addPersonil' ||
               personilMediaQA.calls?.[0]?.photoFile!==null ||
               personilMediaQA.calls?.[0]?.personil?.namaPersonil!=='QA Person No Photo' ||
               personilMediaQA.calls?.[1]?.action!=='addPersonil' ||
               personilMediaQA.calls?.[1]?.photoFile?.name!=='qa-person.jpg' ||
               personilMediaQA.calls?.[1]?.photoFile?.mimeType!=='image/jpeg' ||
               personilMediaQA.calls?.[1]?.photoFile?.base64!=='AQID') {
              throw new Error('Personil photo contract failed: '+JSON.stringify(personilMediaQA));
            }
            result.phases.push('personil-media-contract');

            console.log('[QA] Meeting attachment contract');
            const meetingMediaQA = await page.evaluate(async () => {
              const oldApiPost=apiPost;
              const oldSave=mtgWizardSaveStepInputs;
              const oldLoad=mtgLoadAll;
              const oldPop=mtgPopulateFilterOptions;
              const oldDash=mtgRenderDashboard;
              const oldCurrent=mtgRenderCurrentMode;
              const oldClose=closeModal;
              const oldWizard=JSON.parse(JSON.stringify(MTG_STATE.wizard||{}));
              const calls=[];
              const baseWizard=()=>({
                step:1, editId:null, jenis:'Daily Meeting',
                info:{judul:'QA Meeting',tanggal:'2026-09-20',jam:'13:00',lokasi:'QA',moderator:'QA',notulen:'QA',department:'MTC',status:'OPEN'},
                peserta:[],agenda:[],diskusi:'',keputusan:[],ringkasan:'QA',catatan:'',
                links:{factory:[],kaizen:[],sga:[],mesin:[]},
                existingAttachments:[],attachments:[],actionItems:[]
              });
              try{
                apiPost=async p=>{calls.push(JSON.parse(JSON.stringify(p)));return {ok:true,id:'MTG-QA'};};
                mtgWizardSaveStepInputs=()=>{};
                mtgLoadAll=async()=>{};
                mtgPopulateFilterOptions=()=>{};
                mtgRenderDashboard=()=>{};
                mtgRenderCurrentMode=()=>{};
                closeModal=()=>{};

                MTG_STATE.wizard=baseWizard();
                await mtgWizardSubmit();

                MTG_STATE.wizard=baseWizard();
                MTG_STATE.wizard.attachments=[{name:'qa-meeting.pdf',mimeType:'application/pdf',base64:'JVBERg==',_localUrl:'blob:qa-meeting'}];
                await mtgWizardSubmit();

                const saveCalls=calls.filter(x=>x.action==='saveMeeting');
                return {
                  saveCalls,
                  secondHasLocalUrl:Object.prototype.hasOwnProperty.call(saveCalls?.[1]?.attachmentFiles?.[0]||{},'_localUrl')
                };
              }finally{
                apiPost=oldApiPost; mtgWizardSaveStepInputs=oldSave; mtgLoadAll=oldLoad;
                mtgPopulateFilterOptions=oldPop; mtgRenderDashboard=oldDash; mtgRenderCurrentMode=oldCurrent; closeModal=oldClose;
                MTG_STATE.wizard=oldWizard;
              }
            });
            result.meetingMediaQA=meetingMediaQA;
            if(meetingMediaQA.saveCalls?.length!==2 ||
               meetingMediaQA.saveCalls?.[0]?.attachmentFiles?.length!==0 ||
               meetingMediaQA.saveCalls?.[1]?.attachmentFiles?.length!==1 ||
               meetingMediaQA.saveCalls?.[1]?.attachmentFiles?.[0]?.name!=='qa-meeting.pdf' ||
               meetingMediaQA.saveCalls?.[1]?.attachmentFiles?.[0]?.mimeType!=='application/pdf' ||
               meetingMediaQA.saveCalls?.[1]?.attachmentFiles?.[0]?.base64!=='JVBERg==' ||
               meetingMediaQA.secondHasLocalUrl!==false) {
              throw new Error('Meeting attachment contract failed: '+JSON.stringify(meetingMediaQA));
            }
            result.phases.push('meeting-media-contract');

            console.log('[QA] sparepart pagination');
            const selectorQA = await page.evaluate(() => {
              const p = document.createElement('div');
              p.innerHTML = '<button data-pg="1">1</button><button data-sp-pg-action="next">Next</button><select data-sp-page-size><option value="10">10</option></select>';
              document.body.appendChild(p);
              let ok = true;
              let message = '';
              try {
                attachSparepartPaginationHandlers(p);
              } catch (e) {
                ok = false;
                message = String(e && e.stack || e);
              }
              p.remove();
              return { ok, message };
            });
            result.selectorQA = selectorQA;
            if (!selectorQA.ok) {
              throw new Error('Sparepart pagination handler regression: ' + selectorQA.message);
            }
            result.phases.push('pagination');

            const relevantErrors = errors.filter(x =>
              !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError/i.test(x)
            );
            result.relevantErrors = relevantErrors;
            if (relevantErrors.some(x =>
              /TypeError.*(?:forEach|find)|ReferenceError.*renderOmodos4|SyntaxError/i.test(x)
            )) {
              throw new Error('Relevant browser errors: ' + JSON.stringify(relevantErrors.slice(0, 20)));
            }
            result.phases.push('errors-checked');

            console.log('[QA_RESULT] ' + JSON.stringify(result));
          } finally {
            await browser.close();
          }
          JS

          node --check v4-qa.mjs
          timeout -k 5s 45s node v4-qa.mjs

      - name: Remove transient QA files
        if: always()
        run: rm -f package.json package-lock.json v4-qa.mjs
