name: Browser QA OMODOS 4 Master Recovery
# QA trigger after V4 script relocation

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/browser-qa-v4.yml"
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - ".github/workflows/browser-qa-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate OMODOS 4 Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check public/omodos4/technical-performance.js
          grep -Fq 'OMODOS_TECHNICAL_PERFORMANCE_LAZY_V1' public/index.html
          grep -Fq "if(view === 'technical-performance') return isSuperadmin();" public/index.html
          grep -Fq "script.src='/omodos4/technical-performance.js'" public/index.html
          grep -Fq "String(u.role||u.Role||'').toLowerCase()==='superadmin'" public/omodos4/technical-performance.js
          grep -Fq 'async function readFile(file)' public/omodos4/technical-performance.js
          # Top 3 now has a separate ODIN source; do not require the retired OEE/MTC proxy.
          grep -Fq 'function readOdinFile(file)' public/omodos4/technical-performance.js
          grep -Fq 'function odinTopRows()' public/omodos4/technical-performance.js
          grep -Fq "if(state.tab==='actions')return odinActionContent();" public/omodos4/technical-performance.js
          grep -Fq 'function odinCanonicalIssue(machine,issue)' public/omodos4/technical-performance.js
          grep -Fq "'Variasi deskripsi sumber':g.variants.join(' | ')" public/omodos4/technical-performance.js
          grep -Fq 'function extractOfficialOee(wb)' public/omodos4/technical-performance.js
          grep -Fq 'function extractMtcAudit(X,wb)' public/omodos4/technical-performance.js
          grep -Fq "X.read(buf,{type:'array',cellDates:false,cellStyles:true})" public/omodos4/technical-performance.js
          grep -Fq 'mismatch:result.some(function(r){return r.mismatch;})' public/omodos4/technical-performance.js
          node tools/test_technical_performance_odin.cjs
          node tools/test_technical_performance_source_truth.cjs
          grep -Fq 'for(var i=1;i<a.length;i++)if(Math.abs(a[i]-a[0])>1e-9)return NaN;' public/omodos4/technical-performance.js
          grep -Fq "var mtcRows=state.rows.filter(function(r){return /^mtc$/i.test(String(val(r,'category')).trim());});" public/omodos4/technical-performance.js
          grep -Fq "if(n===1&&!explicitPercent)return NaN" public/omodos4/technical-performance.js
          grep -Fq 'function calcOeeRows()' public/omodos4/technical-performance.js
          grep -Fq 'function hours(row,useMtcLostTime)' public/omodos4/technical-performance.js
          grep -Fq "state.mapping.lt?val(row,'lt'):val(row,'downtime')" public/omodos4/technical-performance.js
          grep -Fq 'hours(r,false)' public/omodos4/technical-performance.js
          grep -Fq 'hours(r,true)' public/omodos4/technical-performance.js
          grep -Fq 'Availability × Performance × Quality' public/omodos4/technical-performance.js
          grep -Fq 'OEE × Utilization' public/omodos4/technical-performance.js
          grep -Fq 'OEE sumber' public/omodos4/technical-performance.js
          grep -Fq 'OEE hitung' public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('utilization','Utilization untuk TEEP')" public/omodos4/technical-performance.js
          grep -Fq 'MTBF/MTTR hanya diringkas dari nilai eksplisit yang dipetakan' public/omodos4/technical-performance.js
          grep -Fq 'TECHNICAL_PERFORMANCE_MVP_V1' public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('availability','Availability (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('performance','Performance (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('quality','Quality (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('oee','OEE sumber (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('utilization','Utilization untuk TEEP')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('teep','TEEP sumber (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('targetOee','Target OEE (%)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('mtbf','MTBF (jam)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('mttr','MTTR (jam)')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('rootCause','Root cause')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('actionPlan','Action plan')" public/omodos4/technical-performance.js
          grep -Fq "fieldSelect('enpi','ENPI sumber (kWh/sheet)')" public/omodos4/technical-performance.js
          grep -Fq "return /^mtc$/i.test(String(val(r,'category')).trim())" public/omodos4/technical-performance.js
          grep -Fq "var calculatedOee=[a,p,q].every(Number.isFinite)?a*p*q:NaN;" public/omodos4/technical-performance.js
          grep -Fq "var calculatedTeep=Number.isFinite(oee)&&Number.isFinite(u)?oee*u:NaN;" public/omodos4/technical-performance.js
          grep -Fq "Sumber ENPI atau energi ÷ sheet" public/omodos4/technical-performance.js
          grep -Fq "Top 3" public/omodos4/technical-performance.js
          grep -Fq "File tidak diunggah ke server" public/omodos4/technical-performance.js
          grep -Fq "String(u.role||u.Role||'').toLowerCase()==='superadmin'" public/omodos4/technical-performance.js
          node tools/test_factory_home_card_detail.cjs
          node tools/test_logbook_review_fixes.cjs

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('src/worker.js','utf8');
          const regStart=s.indexOf('const ACTION_REGISTRY = {');
          const regEnd=s.indexOf('function resolveAction_',regStart);
          const regBlock=s.slice(regStart,regEnd);
          const runtime=new Set([...regBlock.matchAll(/^\s*"([^"]+)":\s*\{\s*permission:/gm)].map(m=>m[1]));
          const dynStart=s.indexOf('function registerAllPublicActions_()');
          const dynEnd=s.indexOf('"registerAllPublicActions_"))();',dynStart);
          const dyn=s.slice(dynStart,dynEnd);
          for(const m of dyn.matchAll(/add\("([^"]+)"/g)) runtime.add(m[1]);
          for(const m of dyn.matchAll(/\[([^\]]+)\]\.forEach\(function\(a\)\s*\{\s*add\(a,/g)){
            for(const q of m[1].matchAll(/"([^"]+)"/g)) runtime.add(q[1]);
          }
          const actions=[];
          for(const fn of ['handleLegacyGet_(e)','handleLegacyPost_(body)']){
            const st=s.indexOf('function '+fn);
            const en=s.indexOf('__name('+fn.split('(')[0],st);
            const block=s.slice(st,en);
            for(const m of block.matchAll(/if\s*\(action\s*===\s*"([^"]+)"/g)) actions.push(m[1]);
          }
          const missing=[...new Set(actions.filter(a=>!runtime.has(a)))];
          if(missing.length){ console.error('Unregistered legacy actions:',missing.join(', ')); process.exit(1); }
          console.log('Legacy action registry coverage OK:',new Set(actions).size,'actions');
          NODE

          # Attachments must be private: direct /files links require a valid HttpOnly session cookie.
          grep -Fq '__Host-OMODOSFileSession' src/worker.js
          grep -Fq 'SameSite=Strict' src/worker.js
          grep -Fq 'requireFileSession(request, backend)' src/worker.js
          grep -Fq 'response.headers.append("Set-Cookie"' src/worker.js
          grep -Fq '"Cache-Control": "private, no-store, max-age=0"' src/worker.js

          ! grep -Fq 'recurring.set(lower(d), (recurring.get(lower(d)) || { label: d, count: 0 }).count + 1)' src/worker.js
          grep -Fq 'const cur = recurring.get(k) || { label: d, count: 0 };' src/worker.js
          grep -Fq 'cur.count++;' src/worker.js

          grep -Fq 'const y = num(year), m = monthNumber(month);' src/worker.js

          grep -Fq 'machineMaster.forEach((r) =>' src/worker.js
          grep -Fq 'if (!machineCoverage.has(key)) machineCoverage.set(key' src/worker.js
          grep -Fq 'p.gaps.length > 0 || p.notCompetent > 0' src/worker.js

          # Machine scoping must use normalized whole-phrase matching, not loose substring matching.
          grep -Fq 'function machinePhraseMatch(value, q)' src/worker.js
          grep -Fq '(" " + v + " ").includes(" " + needle + " ")' src/worker.js
          ! grep -Fq 'lower(machineName(o)).includes(q)' src/worker.js
          ! grep -Fq 'lower(n.label).includes(lower(q))' src/worker.js

          grep -Fq 'function improvementMentionsMachine(record, machine)' src/worker.js
          ! grep -Fq 'existingText.includes(key)' src/worker.js

          # Shift and morning briefs must use OMODOS brief evidence, not generic keyword retrieval.
          grep -Fq 'body.purpose === "shift" || body.purpose === "morning-brief"' src/worker.js
          grep -Fq 'OMODOS4.dispatch({ action: "v4.getBrief"' src/worker.js
          ! grep -Fq 'Internal brief context:' public/omodos4/hotfix.js

          # Empty stock cells must not be interpreted as stockout.
          grep -Fq 'function stockQtyValue(r)' src/worker.js
          grep -Fq 'return qty !== null && qty <= 0;' src/worker.js
          grep -Fq '(x.factors.stockRisk || x.factors.stockout || x.factors.etaOverdue)' src/worker.js

          # MTTR uses only failure events with recorded positive repair/downtime duration.
          grep -Fq 'const repairEvents = events.filter((r) => downtimeMinutes(r) > 0);' src/worker.js
          grep -Fq 'repairDurationEvidenceEvents: repairEvents.length' src/worker.js
          grep -Fq '!/breakdown|emergency|failure|abnormal|corrective/' src/worker.js

          grep -Fq 'const SOURCE_TRUTH_START_MS = Date.parse(SOURCE_TRUTH_START_ISO);' src/worker.js
          grep -Fq 'return data.filter((r) => sourceTimestamp(r) >= SOURCE_TRUTH_START_MS);' src/worker.js

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate Worker JavaScript
        run: node --check src/worker.js

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory public >/tmp/omodos-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omodos-http.log || true
          exit 1

      - name: Run V4 browser regression checks
        shell: bash
        run: |
          cat > v4-qa.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const result = { phases: [] };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(10000);

            page.on('pageerror', e => errors.push(String(e)));
            page.on('dialog', async d => {
              console.log('[QA_DIALOG] ' + d.type() + ': ' + d.message());
              try { await d.dismiss(); } catch {}
            });
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const t = msg.text();
                if (!/Failed to load resource|ERR_CONNECTION|fetch|network/i.test(t)) {
                  errors.push('console: ' + t);
                }
              }
            });

            console.log('[QA] open');
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 15000
            });
            result.phases.push('open');

            console.log('[QA] structural');
            const structural = await page.evaluate(() => ({
              nav: !!document.getElementById('v4-nav-group'),
              view: !!document.getElementById('view-omodos4'),
              ns: !!window.OMODOS4,
              render: typeof window.renderOmodos4 === 'function',
              gate: typeof canAccessView_ === 'function',
              rbac: typeof applyRbacToUi === 'function'
            }));
            result.structural = structural;
            if (!Object.values(structural).every(Boolean)) {
              throw new Error('V4 structural check failed: ' + JSON.stringify(structural));
            }
            result.phases.push('structural');

            console.log('[QA] non-superadmin');
            const admin = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-admin', displayName: 'QA Admin', role: 'Admin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();

              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              const active = document.getElementById('view-omodos4').classList.contains('active');
              const technicalPerformanceAllowed = canAccessView_('technical-performance');
              const technicalPerformanceGo = goToView('technical-performance');
              const tpPage = document.getElementById('view-technical-performance');
              const technicalPerformanceActive = !!tpPage?.classList.contains('active');
              return { allowed, display, go, active, technicalPerformanceAllowed,
                technicalPerformanceGo, technicalPerformanceActive };
            });
            result.admin = admin;
            if (admin.allowed !== false || admin.display !== 'none' || admin.go !== false || admin.active !== false ||
                admin.technicalPerformanceAllowed !== false || admin.technicalPerformanceGo !== false ||
                admin.technicalPerformanceActive) {
              throw new Error('Non-Superadmin gate failed: ' + JSON.stringify(admin));
            }
            result.phases.push('non-superadmin');

            console.log('[QA] Technical Performance stays unloaded for non-Superadmin');
            await page.waitForTimeout(100);
            const technicalPerformanceDenied = await page.evaluate(() => {
              const nav = document.getElementById('nav-technical-performance');
              const tpPage = document.getElementById('view-technical-performance');
              return {
                script: !!document.getElementById('omodos-technical-performance-lazy-script'),
                routeAllowed: canAccessView_('technical-performance'),
                routeVisible: !!tpPage && getComputedStyle(tpPage).display !== 'none' &&
                  !tpPage.hidden && tpPage.getAttribute('aria-hidden') !== 'true',
                navVisible: !!nav && getComputedStyle(nav).display !== 'none',
                modulePresent: !!window.OMODOS_TechnicalPerformance
              };
            });
            result.technicalPerformanceDenied = technicalPerformanceDenied;
            // A JS module that was loaded earlier cannot be unloaded from a live page.
            // The enforced security boundary is the route gate plus hidden nav/page.
            if (technicalPerformanceDenied.routeAllowed || technicalPerformanceDenied.routeVisible ||
                technicalPerformanceDenied.navVisible) {
              throw new Error('Technical Performance was accessible for a non-Superadmin: ' + JSON.stringify(technicalPerformanceDenied));
            }
            result.phases.push('technical-performance-denied-for-admin');

            console.log('[QA] superadmin');
            const supGate = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();
              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              return { allowed, display, go };
            });
            // OMODOS 4 is intentionally fetched after RBAC approves navigation.
            await page.waitForFunction(() => {
              const view = document.getElementById('view-omodos4');
              const cards = document.querySelectorAll('#v4-summary .v4-card').length;
              return window.OMODOS4?.version === '4.0-master-recovery-100'
                && !!view?.classList.contains('active') && cards === 6;
            }, null, { timeout: 15000 });
            const supState = await page.evaluate(() => ({
              active: document.getElementById('view-omodos4').classList.contains('active'),
              cards: document.querySelectorAll('#v4-summary .v4-card').length,
              version: window.OMODOS4?.version || ''
            }));
            const sup = { ...supGate, ...supState };
            result.superadmin = sup;
            if (sup.allowed !== true || sup.display === 'none' || sup.go !== true || sup.active !== true || sup.cards !== 6) {
              throw new Error('Superadmin V4 access failed: ' + JSON.stringify(sup));
            }
            result.phases.push('superadmin');

            console.log('[QA] Technical Performance lazy-loads for Superadmin');
            await page.waitForFunction(() => !!window.OMODOS_TechnicalPerformance &&
              !!document.getElementById('nav-technical-performance') &&
              getComputedStyle(document.getElementById('nav-technical-performance')).display !== 'none',
              null, { timeout: 10000, polling: 100 });
            const technicalPerformanceAdmin = await page.evaluate(() => ({
              routeAllowed: canAccessView_('technical-performance'),
              module: !!window.OMODOS_TechnicalPerformance,
              nav: !!document.getElementById('nav-technical-performance'),
              navVisible: !!document.getElementById('nav-technical-performance') &&
                getComputedStyle(document.getElementById('nav-technical-performance')).display !== 'none',
              page: !!document.getElementById('view-technical-performance')
            }));
            result.technicalPerformanceAdmin = technicalPerformanceAdmin;
            if (technicalPerformanceAdmin.routeAllowed !== true ||
                !technicalPerformanceAdmin.module || !technicalPerformanceAdmin.nav ||
                !technicalPerformanceAdmin.navVisible || !technicalPerformanceAdmin.page) {
              throw new Error('Technical Performance Superadmin access failed: ' + JSON.stringify(technicalPerformanceAdmin));
            }
            result.phases.push('technical-performance-superadmin-lazy-load');

            console.log('[QA] frontend recovery + UI safety');
            await page.evaluate(() => window.dispatchEvent(new Event('storage')));
            await page.waitForTimeout(100);
            const uiSafety = await page.evaluate(() => {
              const v4 = document.getElementById('v4-nav-group');
              const help = document.getElementById('copilot-help');
              const helpInside = !!help?.closest('#copilot-panel');
              const helpOutside = [...document.querySelectorAll('#copilot-help')].some(x => !x.closest('#copilot-panel'));
              const filterMachine = !!document.getElementById('filter-machine');
              const recoveredModules = document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length;

              try { toast('QA toast layer'); } catch {}
              const toastEl = document.querySelector('.toast');
              const copilot = document.getElementById('copilot-panel');
              const toastStyle = toastEl ? getComputedStyle(toastEl) : null;
              const copilotStyle = copilot ? getComputedStyle(copilot) : null;
              const toastZ = Number.parseInt(toastStyle?.zIndex || '0', 10) || 0;
              const copilotZ = Number.parseInt(copilotStyle?.zIndex || '0', 10) || 0;

              return {
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules,
                helpInside,
                helpOutside,
                filterMachine,
                toastZ,
                copilotZ,
                toastTop: toastStyle?.top || '',
                toastBottom: toastStyle?.bottom || ''
              };
            });
            result.uiSafety = uiSafety;
            const toastTopPx = Number.parseFloat(uiSafety.toastTop);
            if (!uiSafety.authorizedClass || uiSafety.recoveredModules < 10 || !uiSafety.helpInside || uiSafety.helpOutside || !uiSafety.filterMachine || uiSafety.toastZ <= uiSafety.copilotZ || !Number.isFinite(toastTopPx) || toastTopPx < 0 || toastTopPx > 40) {
              throw new Error('Frontend recovery/UI safety failed: ' + JSON.stringify(uiSafety));
            }
            result.phases.push('ui-safety');

            console.log('[QA] non-superadmin recovered menu fail-closed');
            const recoveredDeny = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-tech', displayName: 'QA Tech', role: 'Tech' };
              PERMISSIONS = {};
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
              const v4 = document.getElementById('v4-nav-group');
              const tpNav = document.getElementById('nav-technical-performance');
              const tpPage = document.getElementById('view-technical-performance');
              return {
                allowed: canAccessView_('omodos4'),
                technicalPerformanceAllowed: canAccessView_('technical-performance'),
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules: document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length,
                technicalPerformanceHidden: !tpNav || getComputedStyle(tpNav).display === 'none',
                technicalPerformancePageHidden: !tpPage || getComputedStyle(tpPage).display === 'none' ||
                  tpPage.hidden || tpPage.getAttribute('aria-hidden') === 'true'
              };
            });
            result.recoveredDeny = recoveredDeny;
            if (recoveredDeny.allowed !== false || recoveredDeny.technicalPerformanceAllowed !== false ||
                recoveredDeny.authorizedClass !== false || recoveredDeny.recoveredModules !== 0 ||
                !recoveredDeny.technicalPerformanceHidden || !recoveredDeny.technicalPerformancePageHidden) {
              throw new Error('Recovered V4 fail-closed check failed: ' + JSON.stringify(recoveredDeny));
            }
            result.phases.push('recovered-deny');

            console.log('[QA] source-truth machine selectors');
            const sourceTruthMachineNames = await page.evaluate(() => {
              const oldEntries = ENTRIES;
              const oldMachines = MACHINES;
              const oldPatrol = PM_REPORTS;
              try {
                MACHINES = [{ 'Kode Mesin':'QA-MASTER', 'Nama Mesin':'QA Master Current' }];
                ENTRIES = [
                  { 'Nama Mesin':'QA Old Logbook', 'Tanggal':'2026-08-31', 'Timestamp Input':'2026-08-31T08:00:00+07:00' },
                  { 'Nama Mesin':'QA New Logbook', 'Tanggal':'2026-09-02', 'Timestamp Input':'2026-09-02T08:00:00+07:00' }
                ];
                PM_REPORTS = [
                  { 'Nama Mesin':'QA Old Patrol', 'Tanggal':'2026-08-20' },
                  { 'Nama Mesin':'QA New Patrol', 'Tanggal':'2026-09-03' }
                ];
                return window.OMODOS4.getMachineNames();
              } finally {
                ENTRIES = oldEntries;
                MACHINES = oldMachines;
                PM_REPORTS = oldPatrol;
              }
            });
            result.sourceTruthMachineNames = sourceTruthMachineNames;
            if (!sourceTruthMachineNames.includes('QA Master Current') ||
                !sourceTruthMachineNames.includes('QA New Logbook') ||
                !sourceTruthMachineNames.includes('QA New Patrol') ||
                sourceTruthMachineNames.includes('QA Old Logbook') ||
                sourceTruthMachineNames.includes('QA Old Patrol')) {
              throw new Error('V4 machine selector cutoff failed: ' + JSON.stringify(sourceTruthMachineNames));
            }
            result.phases.push('source-truth-machine-selectors');

            const startupError = await page.evaluate(() => {
              const bg = document.getElementById('app-error-modal-bg');
              const message = document.getElementById('app-error-modal-message')?.textContent || '';
              const detail = document.getElementById('app-error-modal-detail')?.textContent || '';
              if (bg?.classList.contains('active')) {
                const close = document.getElementById('app-error-modal-close') || document.getElementById('app-error-modal-ok');
                close?.click();
              }
              return { active: !!bg?.classList.contains('active'), message, detail: detail.slice(0, 1200) };
            });
            if (startupError.message || startupError.detail) console.log('[QA_STARTUP_ERROR_MODAL] ' + JSON.stringify(startupError));
            
            console.log('[QA] physical OMODOS 4 sidebar module clicks');
            await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              const app=document.getElementById('app-root');
              const gate=document.getElementById('login-gate');
              if(app) app.classList.add('unlocked');
              if(gate) gate.style.display='none';
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
            });
            await page.waitForTimeout(100);

            const v4Parent = page.locator('#v4-nav-group .nav-parent-btn[data-group="omodos4"]');
            const v4Submenu = page.locator('#v4-nav-group [data-submenu="omodos4"]');
            if (!(await v4Submenu.evaluate(el => el.classList.contains('open')))) {
              await v4Parent.click();
              await page.waitForTimeout(40);
            }

            const physicalModules = page.locator('#v4-nav-group [data-v4-safe-module]');
            const physicalCount = await physicalModules.count();
            const sidebarClickQA = { moduleCount: physicalCount, failures: [], modules: [] };
            for (let i = 0; i < physicalCount; i++) {
              await page.evaluate(() => {
                try { if(typeof goToView === 'function') goToView('omodos4'); } catch {}
                const app=document.getElementById('app-root');
                const sidebar=document.querySelector('.sidebar');
                if(app){
                  app.classList.remove('dash-mode');
                  app.classList.add('sidebar-drawer-open','menu-visible');
                }
                if(sidebar) sidebar.classList.add('open');
                const sub=document.querySelector('#v4-nav-group [data-submenu="omodos4"]');
                const parent=document.querySelector('#v4-nav-group .nav-parent-btn[data-group="omodos4"]');
                if(sub){sub.classList.add('open');sub.style.maxHeight='none';sub.style.overflow='visible';}
                if(parent) parent.classList.add('open');
              });
