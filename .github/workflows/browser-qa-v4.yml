                for(let i=0;i<50&&!calls.length;i++)await new Promise(r=>setTimeout(r,10));
                if(calls.length!==1||calls[0].report.petugas!=='QA Person A / QA Person B / QA Person C'||calls[0].report.findings.length!==1||calls[0].files.length!==1)throw new Error('Team Patrol save lost personnel/finding/photo');
                patrolSetPersonil_(calls[0].report.petugas);
                if(patrolPersonilNames_().length!==3)throw new Error('Edit team restoration failed');
                renderPatrolChecklist();
                const headings=[...document.querySelectorAll('.patrol-category-heading')];
                const clearCategories=headings.length>1&&headings.every(h=>parseFloat(getComputedStyle(h).fontSize)>=17&&parseFloat(getComputedStyle(h.parentElement).marginTop)>=20);
                if(!clearCategories)throw new Error('Patrol category headings too small or crowded');
                return {team:3,unaddedBlocked:true,findingSaved:true,photoSaved:true,editTeam:true,clearCategories};
              }finally{persistPmReport=oldPersist;patrolResetWizard();}
            });
            result.patrolRevisions=patrolRevisions;
            result.phases.push('patrol-team-pending-finding');

            console.log('[QA] accidental form submit / reload guard');
            const submitGuard = await page.evaluate(() => {
              const form = document.getElementById('form-entry');
              if (!form) throw new Error('Logbook form unavailable');
              const buttons = [...form.querySelectorAll('button')];
              const missingTypes = buttons.filter(button => !button.hasAttribute('type')).map(button => button.id || button.textContent.trim());
              const helper = buttons.find(button => button.id !== 'btn-submit' && button.type === 'button');
              if (helper) {
                let prevented = false;
                const capture = event => { if (event.submitter === helper) prevented = event.defaultPrevented; };
                form.addEventListener('submit', capture, true);
                const event = new SubmitEvent('submit', { bubbles: true, cancelable: true, submitter: helper });
                form.dispatchEvent(event);
                form.removeEventListener('submit', capture, true);
                return { missingTypes, helperId: helper.id, submitPrevented: event.defaultPrevented, defaultActionPrevented: prevented };
              }
              return { missingTypes, submitPrevented: null, helperId: null };
            });
            result.submitGuard = submitGuard;
            if (submitGuard.missingTypes.length || submitGuard.submitPrevented !== true) {
              throw new Error('Accidental form submit guard failed: ' + JSON.stringify(submitGuard));
            }

            console.log('[QA] stale-auth-response and no-reload session expiry');
            const authReloadQA = await page.evaluate(() => {
              const saved = {
                user: CURRENT_USER,
                token: SESSION_TOKEN,
                settingAuth: SETTING_AUTH_OK,
                settingToken: SETTING_SESSION_TOKEN
              };
              const realLogout = window.logoutUser;
              const calls = [];
              try {
                window.logoutUser = options => { calls.push(options || null); };
                CURRENT_USER = { username: 'qa-auth-current', displayName: 'QA Auth Current', role: 'Superadmin' };
                SESSION_TOKEN = 'qa-current-session';
                SETTING_AUTH_OK = false;
                SETTING_SESSION_TOKEN = '';

                handleApiAuthFailure_('SESSION_EXPIRED', 'qa-stale-session');
                const staleResponseIgnored = calls.length === 0 && SESSION_TOKEN === 'qa-current-session';

                handleApiAuthFailure_('SESSION_EXPIRED', 'qa-current-session');
                const logoutOptions = calls[0] || null;
                const handlerSource = String(handleApiAuthFailure_);
                const logoutSource = String(realLogout);
                const out = {
                  staleResponseIgnored,
                  currentSessionHandled: calls.length === 1,
                  reload: logoutOptions?.reload,
                  reason: logoutOptions?.reason,
                  authHandlerHasStaleGuard: handlerSource.includes('requestToken !== SESSION_TOKEN'),
                  authHandlerUsesNoReload: handlerSource.includes('reload:false'),
                  logoutSupportsNoReload: logoutSource.includes('options.reload !== false')
                };
                if (!out.staleResponseIgnored || !out.currentSessionHandled ||
                    out.reload !== false || out.reason !== 'session-expired' ||
                    !out.authHandlerHasStaleGuard || !out.authHandlerUsesNoReload ||
                    !out.logoutSupportsNoReload) {
                  throw new Error('Unexpected auth reload policy: ' + JSON.stringify(out));
                }
                return out;
              } finally {
                window.logoutUser = realLogout;
                CURRENT_USER = saved.user;
                SESSION_TOKEN = saved.token;
                SETTING_AUTH_OK = saved.settingAuth;
                SETTING_SESSION_TOKEN = saved.settingToken;
              }
            });
            result.authReloadQA = authReloadQA;
            result.phases.push('stale-auth-no-reload');

            await page.setViewportSize({ width: 1440, height: 1000 });

            const relevantErrors = errors.filter(x =>
              !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError/i.test(x)
            );
            result.relevantErrors = relevantErrors;
            if (relevantErrors.some(x =>
              /TypeError.*(?:forEach|find)|ReferenceError.*renderOmodos4|SyntaxError/i.test(x)
            )) {
              throw new Error('Relevant browser errors: ' + JSON.stringify(relevantErrors.slice(0, 20)));
            }
            result.phases.push('errors-checked');

            console.log('[QA_RESULT] ' + JSON.stringify(result));
          } finally {
            await browser.close();
          }
          JS

          node --check v4-qa.mjs
          timeout -k 5s 360s node v4-qa.mjs

      - name: Remove transient QA files
        if: always()
        run: rm -f package.json package-lock.json v4-qa.mjs
