name: Browser QA OMODOS 4 Phase 1
# QA trigger after V4 script relocation

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/browser-qa-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory public >/tmp/omodos-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omodos-http.log || true
          exit 1

      - name: Run V4 browser regression checks
        shell: bash
        run: |
          cat > v4-qa.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const result = { phases: [] };

          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            page.setDefaultTimeout(10000);

            page.on('pageerror', e => errors.push(String(e)));
            page.on('dialog', async d => {
              console.log('[QA_DIALOG] ' + d.type() + ': ' + d.message());
              try { await d.dismiss(); } catch {}
            });
            page.on('console', msg => {
              if (msg.type() === 'error') {
                const t = msg.text();
                if (!/Failed to load resource|ERR_CONNECTION|fetch|network/i.test(t)) {
                  errors.push('console: ' + t);
                }
              }
            });

            console.log('[QA] open');
            await page.goto('http://127.0.0.1:4173/', {
              waitUntil: 'domcontentloaded',
              timeout: 15000
            });
            result.phases.push('open');

            console.log('[QA] structural');
            const structural = await page.evaluate(() => ({
              nav: !!document.getElementById('v4-nav-group'),
              view: !!document.getElementById('view-omodos4'),
              ns: !!window.OMODOS4,
              render: typeof window.renderOmodos4 === 'function',
              gate: typeof canAccessView_ === 'function',
              rbac: typeof applyRbacToUi === 'function'
            }));
            result.structural = structural;
            if (!Object.values(structural).every(Boolean)) {
              throw new Error('V4 structural check failed: ' + JSON.stringify(structural));
            }
            result.phases.push('structural');

            console.log('[QA] non-superadmin');
            const admin = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-admin', displayName: 'QA Admin', role: 'Admin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();

              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              const active = document.getElementById('view-omodos4').classList.contains('active');
              return { allowed, display, go, active };
            });
            result.admin = admin;
            if (admin.allowed !== false || admin.display !== 'none' || admin.go !== false || admin.active !== false) {
              throw new Error('Non-Superadmin gate failed: ' + JSON.stringify(admin));
            }
            result.phases.push('non-superadmin');

            console.log('[QA] superadmin');
            const sup = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();

              const allowed = canAccessView_('omodos4');
              const display = document.getElementById('v4-nav-group').style.display;
              const go = goToView('omodos4');
              const active = document.getElementById('view-omodos4').classList.contains('active');
              const cards = document.querySelectorAll('#v4-summary .v4-card').length;
              return { allowed, display, go, active, cards };
            });
            result.superadmin = sup;
            if (sup.allowed !== true || sup.display === 'none' || sup.go !== true || sup.active !== true || sup.cards !== 6) {
              throw new Error('Superadmin V4 access failed: ' + JSON.stringify(sup));
            }
            result.phases.push('superadmin');

            console.log('[QA] frontend recovery + UI safety');
            await page.evaluate(() => window.dispatchEvent(new Event('storage')));
            await page.waitForTimeout(100);
            const uiSafety = await page.evaluate(() => {
              const v4 = document.getElementById('v4-nav-group');
              const help = document.getElementById('copilot-help');
              const helpInside = !!help?.closest('#copilot-panel');
              const helpOutside = [...document.querySelectorAll('#copilot-help')].some(x => !x.closest('#copilot-panel'));
              const filterMachine = !!document.getElementById('filter-machine');
              const recoveredModules = document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length;

              try { toast('QA toast layer'); } catch {}
              const toastEl = document.querySelector('.toast');
              const copilot = document.getElementById('copilot-panel');
              const toastStyle = toastEl ? getComputedStyle(toastEl) : null;
              const copilotStyle = copilot ? getComputedStyle(copilot) : null;
              const toastZ = Number.parseInt(toastStyle?.zIndex || '0', 10) || 0;
              const copilotZ = Number.parseInt(copilotStyle?.zIndex || '0', 10) || 0;

              return {
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules,
                helpInside,
                helpOutside,
                filterMachine,
                toastZ,
                copilotZ,
                toastTop: toastStyle?.top || '',
                toastBottom: toastStyle?.bottom || ''
              };
            });
            result.uiSafety = uiSafety;
            const toastTopPx = Number.parseFloat(uiSafety.toastTop);
            if (!uiSafety.authorizedClass || uiSafety.recoveredModules < 11 || !uiSafety.helpInside || uiSafety.helpOutside || !uiSafety.filterMachine || uiSafety.toastZ <= uiSafety.copilotZ || !Number.isFinite(toastTopPx) || toastTopPx < 0 || toastTopPx > 40) {
              throw new Error('Frontend recovery/UI safety failed: ' + JSON.stringify(uiSafety));
            }
            result.phases.push('ui-safety');

            console.log('[QA] non-superadmin recovered menu fail-closed');
            const recoveredDeny = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-tech', displayName: 'QA Tech', role: 'Tech' };
              PERMISSIONS = {};
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
              const v4 = document.getElementById('v4-nav-group');
              return {
                allowed: canAccessView_('omodos4'),
                authorizedClass: !!v4?.classList.contains('v4-authorized'),
                recoveredModules: document.querySelectorAll('#v4-nav-group [data-v4-safe-module]').length
              };
            });
            result.recoveredDeny = recoveredDeny;
            if (recoveredDeny.allowed !== false || recoveredDeny.authorizedClass !== false || recoveredDeny.recoveredModules !== 0) {
              throw new Error('Recovered V4 fail-closed check failed: ' + JSON.stringify(recoveredDeny));
            }
            result.phases.push('recovered-deny');

            console.log('[QA] recovered module route completeness');
            await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              PERMISSIONS = {};
              applyRbacToUi();
              window.dispatchEvent(new Event('storage'));
            });
            await page.waitForTimeout(80);

            const moduleCount = await page.locator('#v4-nav-group [data-v4-safe-module]').count();
            const routeAudit = { moduleCount, tileCount: 0, emptyRoutes: [], invalidTargets: [] };
            for (let i = 0; i < moduleCount; i++) {
              const module = page.locator('#v4-nav-group [data-v4-safe-module]').nth(i);
              const moduleName = (await module.getAttribute('aria-label')) || ('module-' + i);
              await module.evaluate(el => el.click());
              await page.waitForTimeout(30);

              const tiles = page.locator('#v4-safe-stage [data-v4-route]');
              const count = await tiles.count();
              routeAudit.tileCount += count;
              for (let j = 0; j < count; j++) {
                const tile = tiles.nth(j);
                const route = (await tile.getAttribute('data-v4-route')) || '';
                const label = ((await tile.locator('strong').textContent()) || '').trim();
                if (!route) {
                  routeAudit.emptyRoutes.push(moduleName + ' > ' + label);
                  continue;
                }
                if (route === '@copilot') {
                  const ok = await page.locator('#copilot-fab').count();
                  if (!ok) routeAudit.invalidTargets.push(label + ' -> ' + route);
                  continue;
                }
                if (route === '@copilot-help') {
                  const ok = await page.locator('#copilot-fab').count() && await page.locator('#copilot-help').count();
                  if (!ok) routeAudit.invalidTargets.push(label + ' -> ' + route);
                  continue;
                }
                const exists = await page.locator('#view-' + route).count();
                if (!exists) routeAudit.invalidTargets.push(label + ' -> ' + route);
              }
            }
            result.routeAudit = routeAudit;
            if (routeAudit.moduleCount !== 11 || routeAudit.tileCount !== 88 || routeAudit.emptyRoutes.length || routeAudit.invalidTargets.length) {
              throw new Error('Recovered module routing audit failed: ' + JSON.stringify(routeAudit));
            }
            result.phases.push('route-completeness');

            console.log('[QA] all application views');
            const viewInventory = await page.evaluate(() => {
              CURRENT_USER = { username: 'qa-super', displayName: 'QA Superadmin', role: 'Superadmin' };
              SESSION_TOKEN = 'qa';
              FEATURE_REGISTRY = mergeFeatureRegistry([]);
              PERMISSIONS = {};
              applyRbacToUi();
              const targets = [...new Set([...document.querySelectorAll('[data-view]')].map(x => String(x.dataset.view || '').trim()).filter(Boolean))].sort();
              const domViews = [...document.querySelectorAll('[id^="view-"]')].map(x => x.id.slice(5)).sort();
              const missingDom = targets.filter(v => !document.getElementById('view-' + v));
              const allViews = [...new Set([...targets, ...domViews])].sort();
              return { targets, domViews, allViews, missingDom };
            });
            result.viewInventory = viewInventory;
            if (viewInventory.missingDom.length) {
              throw new Error('Navigation target without DOM view: ' + JSON.stringify(viewInventory.missingDom));
            }

            const viewFailures = [];
            for (const view of viewInventory.allViews) {
              const beforeErr = errors.length;
              const state = await page.evaluate(v => {
                try {
                  const ok = typeof goToView === 'function' ? goToView(v) : switchToView(v);
                  const el = document.getElementById('view-' + v);
                  return { ok, active: !!el?.classList.contains('active') };
                } catch (e) {
                  return { ok: false, active: false, thrown: String(e && e.stack || e) };
                }
              }, view);
              await page.waitForTimeout(25);
              const newErrors = errors.slice(beforeErr).filter(x => !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError|Failed to load resource/i.test(x));
              if (state.ok === false || !state.active || state.thrown || newErrors.some(x => /TypeError|ReferenceError|SyntaxError/i.test(x))) {
                viewFailures.push({ view, state, errors: newErrors.slice(0, 4) });
              }
            }
            result.viewFailures = viewFailures;
            if (viewFailures.length) {
              throw new Error('Application view navigation/render failures: ' + JSON.stringify(viewFailures.slice(0, 12)));
            }
            result.phases.push('all-views');

            console.log('[QA] critical view controls');
            const critical = await page.evaluate(() => {
              const out = {};
              const open = v => { try { goToView(v); } catch {} };

              open('utama');
              out.logbook = {
                view: !!document.getElementById('view-utama'),
                machineDropdown: !!document.getElementById('filter-machine'),
                paginationTarget: !!document.getElementById('list-utama')
              };

              open('patrol');
              const patrol = document.getElementById('view-patrol');
              out.patrol = {
                view: !!patrol,
                controls: patrol ? patrol.querySelectorAll('button,select,input,textarea').length : 0
              };

              open('sparepart');
              out.sparepart = {
                view: !!document.getElementById('view-sparepart'),
                search: !!document.getElementById('search-sparepart'),
                collectionFilter: !!document.getElementById('filter-sparepart-collection'),
                sort: !!document.getElementById('sort-sparepart'),
                pager: !!document.getElementById('sp-collect-pagination')
              };

              const help = document.getElementById('copilot-help');
              out.copilot = {
                fab: !!document.getElementById('copilot-fab'),
                help: !!help,
                helpInside: !!help?.closest('#copilot-panel')
              };
              return out;
            });
            result.critical = critical;
            if (!critical.logbook.view || !critical.logbook.machineDropdown || !critical.logbook.paginationTarget ||
                !critical.patrol.view || critical.patrol.controls < 1 ||
                !critical.sparepart.view || !critical.sparepart.search || !critical.sparepart.collectionFilter || !critical.sparepart.sort || !critical.sparepart.pager ||
                !critical.copilot.fab || !critical.copilot.help || !critical.copilot.helpInside) {
              throw new Error('Critical view control audit failed: ' + JSON.stringify(critical));
            }
            result.phases.push('critical-controls');

            console.log('[QA] latest machine status source ordering');
            const statusOrdering = await page.evaluate(() => {
              const oldEntries = Array.isArray(ENTRIES) ? ENTRIES.slice() : ENTRIES;
              const oldPm = Array.isArray(PM_REPORTS) ? PM_REPORTS.slice() : PM_REPORTS;
              const oldMachines = Array.isArray(MACHINES) ? MACHINES.slice() : MACHINES;
              try {
                MACHINES = [{ 'Kode Mesin':'QA-STATUS-1', 'Nama Mesin':'QA Status Machine' }];
                ENTRIES = [{
                  'ID':'QA-LOG-1',
                  'Kode Mesin':'QA-STATUS-1',
                  'Nama Mesin':'QA Status Machine',
                  'Tanggal':'2026-09-20',
                  'Waktu':'10:00',
                  'Timestamp Input':'2026-09-20T10:00:00+07:00',
                  'Status':'OPEN',
                  'Deskripsi Masalah':'Logbook lebih lama'
                }];
                PM_REPORTS = [{
                  id:'QA-PATROL-1',
                  kodeMesin:'QA-STATUS-1',
                  namaMesin:'QA Status Machine',
                  tanggal:'2026-09-20',
                  waktuPatrol:'11:00',
                  ts:new Date('2026-09-20T11:00:00+07:00').getTime(),
                  patrolMode:'daily',
                  createdAt:'2026-09-20T11:00:00+07:00',
                  severity:'Kritikal',
                  deskripsiTemuan:'Patrol lebih baru'
                }];
                const machineIdentity = { kode:'QA-STATUS-1', nama:'QA Status Machine' };
                const patrolRecord = PM_REPORTS[0];
                const patrolDiag = {
                  eventTs: typeof patrolEventTs_ === 'function' ? patrolEventTs_(patrolRecord) : null,
                  sot: typeof isSotPatrolRecord_ === 'function' ? isSotPatrolRecord_(patrolRecord) : null,
                  match: typeof machineMatchRecord_ === 'function' ? machineMatchRecord_(patrolRecord, machineIdentity) : null,
                  homeCount: typeof homePatrolRecords_ === 'function' ? homePatrolRecords_().length : null,
                  keys: Object.keys(patrolRecord)
                };
                const patrolNewer = machineLatestStatusSnapshot_(machineIdentity);

                ENTRIES = [{
                  'ID':'QA-LOG-2',
                  'Kode Mesin':'QA-STATUS-1',
                  'Nama Mesin':'QA Status Machine',
                  'Tanggal':'2026-09-20',
                  'Waktu':'12:00',
                  'Timestamp Input':'2026-09-20T12:00:00+07:00',
                  'Status':'SELESAI',
                  'Deskripsi Masalah':'Logbook lebih baru'
                }];
                const logNewer = machineLatestStatusSnapshot_(machineIdentity);
                return {
                  patrolDiag,
                  patrolNewer: {
                    source: patrolNewer?.source,
                    sourceLabel: patrolNewer?.sourceLabel,
                    description: patrolNewer?.description,
                    ts: patrolNewer?.ts
                  },
                  logNewer: {
                    source: logNewer?.source,
                    sourceLabel: logNewer?.sourceLabel,
                    description: logNewer?.description,
                    ts: logNewer?.ts
                  }
                };
              } finally {
                ENTRIES = oldEntries;
                PM_REPORTS = oldPm;
                MACHINES = oldMachines;
              }
            });
            result.statusOrdering = statusOrdering;
            if (statusOrdering.patrolNewer.source !== 'patrol' || statusOrdering.patrolNewer.description !== 'Patrol lebih baru' ||
                statusOrdering.logNewer.source !== 'logbook' || statusOrdering.logNewer.description !== 'Logbook lebih baru' ||
                !(statusOrdering.logNewer.ts > statusOrdering.patrolNewer.ts)) {
              throw new Error('Latest machine status ordering failed: ' + JSON.stringify(statusOrdering));
            }
            result.phases.push('machine-status-ordering');

            console.log('[QA] report category internal flows');
            const reportFlows = {};
            for (const cat of ['rca','ai','report-hub']) {
              await page.evaluate(() => goToView('report'));
              await page.waitForTimeout(30);
              const card = page.locator('#view-report .report-cat-card[data-cat="' + cat + '"]');
              if (await card.count()) {
                await card.evaluate(el => el.click());
                await page.waitForTimeout(30);
                reportFlows[cat] = await page.evaluate(c => !!document.getElementById('view-' + c)?.classList.contains('active'), cat);
              } else {
                reportFlows[cat] = false;
              }
            }
            await page.evaluate(() => goToView('report'));
            await page.waitForTimeout(30);
            const ipalCard = page.locator('#view-report .report-cat-card[data-cat="ipal"]');
            if (await ipalCard.count()) {
              await ipalCard.evaluate(el => el.click());
              await page.waitForTimeout(30);
              reportFlows.ipal = await page.evaluate(() => {
                const grid = document.getElementById('report-cat-grid');
                const form = document.getElementById('ipal-form-wrap');
                const back = document.getElementById('btn-report-back-cat');
                return !!form && !!back && getComputedStyle(grid).display === 'none' && getComputedStyle(back).display !== 'none';
              });
            } else {
              reportFlows.ipal = false;
            }
            result.reportFlows = reportFlows;
            if (!reportFlows.rca || !reportFlows.ai || !reportFlows['report-hub'] || !reportFlows.ipal) {
              throw new Error('Report category flow failed: ' + JSON.stringify(reportFlows));
            }
            result.phases.push('report-flows');

            console.log('[QA] Logbook submit payload without/with photo');
            const logbookSubmitQA = await page.evaluate(async () => {
              const oldApiPost = apiPost;
              const oldLoadAll = loadAll;
              const oldGroqAutoFix = groqAutoFixEntryFields;
              const oldUrl = WEB_APP_URL;
              const oldMachines = Array.isArray(MACHINES) ? MACHINES.slice() : MACHINES;
              const oldPending = Array.isArray(PENDING_FILES) ? PENDING_FILES.slice() : PENDING_FILES;
              const calls = [];

              const waitForCalls = async n => {
                const start = Date.now();
                while (calls.length < n && Date.now() - start < 2000) {
                  await new Promise(r => setTimeout(r, 20));
                }
              };

              const ensureOption = (sel, value, label) => {
                if (!sel) return;
                let opt = [...sel.options].find(o => o.value === value);
                if (!opt) {
                  opt = document.createElement('option');
                  opt.value = value;
                  opt.textContent = label || value;
                  sel.appendChild(opt);
                }
                sel.value = value;
              };

              const fillRequired = () => {
                const form = document.getElementById('form-entry');
                form.classList.remove('wizard-mode');
                form.querySelectorAll('[required]').forEach(el => {
                  if (el.tagName === 'SELECT') {
                    if (el.id === 'select-namaPelapor') ensureOption(el, 'QA Teknisi', 'QA Teknisi');
                    else if (el.id === 'select-kodeMesin') ensureOption(el, 'QA-MCH-1', 'QA-MCH-1');
                    else if (el.id === 'select-namaMesin') ensureOption(el, 'QA Machine', 'QA Machine');
                    else {
                      const usable = [...el.options].find(o => String(o.value || o.textContent || '').trim());
                      if (usable) el.value = usable.value;
                    }
                  } else if (el.type === 'date') el.value = '2026-09-20';
                  else if (el.type === 'time') el.value = el.name === 'jamSelesai' ? '11:00' : '10:00';
                  else if (el.type === 'number') el.value = '1';
                  else if (el.type !== 'file') el.value = 'QA ' + (el.name || el.id || 'field');
                });
                const desc = document.getElementById('ta-deskripsiMasalah');
                const action = document.getElementById('ta-tindakanPerbaikan');
                const note = document.getElementById('ta-catatan');
                const unit = document.getElementById('input-namaUnit');
                if (desc) desc.value = 'QA masalah pengujian';
                if (action) action.value = 'QA tindakan pengujian';
                if (note) note.value = 'QA catatan pengujian';
                if (unit) unit.value = 'QA Unit';
                const notif = form.querySelector('[name="nomorNotifikasi"]');
                if (notif) notif.value = 'QA-NOTIF-001';
                const date = form.querySelector('[name="tanggal"]');
                if (date) date.value = '2026-09-20';
                const start = form.querySelector('[name="jamMulai"]');
                const finish = form.querySelector('[name="jamSelesai"]');
                if (start) start.value = '10:00';
                if (finish) finish.value = '11:00';
                if (typeof computeEstimasi === 'function') computeEstimasi();
                return form;
              };

              try {
                WEB_APP_URL = 'https://qa.invalid';
                MACHINES = [{ 'Kode Mesin':'QA-MCH-1', 'Nama Mesin':'QA Machine', 'Lokasi/Area':'QA Area' }];
                apiPost = async payload => { calls.push(JSON.parse(JSON.stringify(payload))); return {ok:true}; };
                loadAll = async () => ({ok:true});
                groqAutoFixEntryFields = async () => 0;

                PENDING_FILES = [];
                let form = fillRequired();
                form.dispatchEvent(new Event('submit', { bubbles:true, cancelable:true }));
                await waitForCalls(1);

                PENDING_FILES = [{
                  name:'qa-photo.jpg',
                  mimeType:'image/jpeg',
                  base64:'AAECAwQ=',
                  _localUrl:'blob:qa-photo',
                  _isVideo:false
                }];
                form = fillRequired();
                form.dispatchEvent(new Event('submit', { bubbles:true, cancelable:true }));
                await waitForCalls(2);

                const noPhoto = calls[0] || null;
                const withPhoto = calls[1] || null;
                return {
                  callCount: calls.length,
                  noPhoto: noPhoto ? {
                    action:noPhoto.action,
                    filesLength:Array.isArray(noPhoto.files) ? noPhoto.files.length : -1,
                    kodeMesin:noPhoto.entry?.kodeMesin,
                    namaMesin:noPhoto.entry?.namaMesin,
                    lokasi:noPhoto.entry?.lokasi,
                    namaPelapor:noPhoto.entry?.namaPelapor,
                    lokasiSparepart:noPhoto.entry?.lokasiSparepart,
                    description:noPhoto.entry?.deskripsiMasalah
                  } : null,
                  withPhoto: withPhoto ? {
                    action:withPhoto.action,
                    filesLength:Array.isArray(withPhoto.files) ? withPhoto.files.length : -1,
                    firstFile:withPhoto.files?.[0] || null,
                    hasLocalUrl:Object.prototype.hasOwnProperty.call(withPhoto.files?.[0] || {}, '_localUrl'),
                    hasVideoFlag:Object.prototype.hasOwnProperty.call(withPhoto.files?.[0] || {}, '_isVideo')
                  } : null
                };
              } finally {
                apiPost = oldApiPost;
                loadAll = oldLoadAll;
                groqAutoFixEntryFields = oldGroqAutoFix;
                WEB_APP_URL = oldUrl;
                MACHINES = oldMachines;
                PENDING_FILES = oldPending;
                try { renderFilePreviews(); } catch {}
              }
            });
            result.logbookSubmitQA = logbookSubmitQA;
            if (logbookSubmitQA.callCount !== 2 ||
                logbookSubmitQA.noPhoto?.action !== 'addEntry' ||
                logbookSubmitQA.noPhoto?.filesLength !== 0 ||
                logbookSubmitQA.noPhoto?.kodeMesin !== 'QA-MCH-1' ||
                logbookSubmitQA.noPhoto?.namaMesin !== 'QA Machine' ||
                logbookSubmitQA.noPhoto?.lokasi !== 'QA Area' ||
                logbookSubmitQA.noPhoto?.namaPelapor !== 'QA Teknisi' ||
                logbookSubmitQA.noPhoto?.lokasiSparepart !== 'Tidak menggunakan sparepart' ||
                logbookSubmitQA.withPhoto?.action !== 'addEntry' ||
                logbookSubmitQA.withPhoto?.filesLength !== 1 ||
                logbookSubmitQA.withPhoto?.firstFile?.name !== 'qa-photo.jpg' ||
                logbookSubmitQA.withPhoto?.firstFile?.mimeType !== 'image/jpeg' ||
                logbookSubmitQA.withPhoto?.firstFile?.base64 !== 'AAECAwQ=' ||
                logbookSubmitQA.withPhoto?.hasLocalUrl !== false ||
                logbookSubmitQA.withPhoto?.hasVideoFlag !== false) {
              throw new Error('Logbook submit contract failed: ' + JSON.stringify(logbookSubmitQA));
            }
            result.phases.push('logbook-submit-contract');

            console.log('[QA] sparepart pagination');
            const selectorQA = await page.evaluate(() => {
              const p = document.createElement('div');
              p.innerHTML = '<button data-pg="1">1</button><button data-sp-pg-action="next">Next</button><select data-sp-page-size><option value="10">10</option></select>';
              document.body.appendChild(p);
              let ok = true;
              let message = '';
              try {
                attachSparepartPaginationHandlers(p);
              } catch (e) {
                ok = false;
                message = String(e && e.stack || e);
              }
              p.remove();
              return { ok, message };
            });
            result.selectorQA = selectorQA;
            if (!selectorQA.ok) {
              throw new Error('Sparepart pagination handler regression: ' + selectorQA.message);
            }
            result.phases.push('pagination');

            const relevantErrors = errors.filter(x =>
              !/API|backend|Cloudflare|Web App|Failed to fetch|NetworkError/i.test(x)
            );
            result.relevantErrors = relevantErrors;
            if (relevantErrors.some(x =>
              /TypeError.*(?:forEach|find)|ReferenceError.*renderOmodos4|SyntaxError/i.test(x)
            )) {
              throw new Error('Relevant browser errors: ' + JSON.stringify(relevantErrors.slice(0, 20)));
            }
            result.phases.push('errors-checked');

            console.log('[QA_RESULT] ' + JSON.stringify(result));
          } finally {
            await browser.close();
          }
          JS

          node --check v4-qa.mjs
          timeout -k 5s 25s node v4-qa.mjs

      - name: Remove transient QA files
        if: always()
        run: rm -f package.json package-lock.json v4-qa.mjs
