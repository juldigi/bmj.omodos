name: Frontend-only OMODOS4 Safe Recovery v2
on:
  push:
    branches:
      - fix/v4-frontend-only-safe
    paths:
      - ".github/workflows/frontend-only-v4-safe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c0bf44ff86c9587390f09b6d0bc42dd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert stable backend and login routing
        run: |
          echo "fd8ae6b16ad8d60218d99f8590694647bab90edd7422c391450a0bdeb38b640b  src/worker.js" | sha256sum -c -
          grep -q '"main": "src/worker.js"' wrangler.jsonc
          grep -q '"no_bundle": true' wrangler.jsonc
          grep -Fq '"/api/*"' wrangler.jsonc
          ! grep -q '"run_worker_first": true' wrangler.jsonc
      - name: Attach safe frontend assets
        shell: python
        run: |
          from pathlib import Path
          p=Path("public/index.html")
          s=p.read_text(encoding="utf-8")
          marker="OMODOS4_FRONTEND_SAFE_V2"
          if marker not in s:
              if "</head>" not in s or "</body>" not in s:
                  raise SystemExit("HTML anchors missing")
              s=s.replace("</head>",'<link rel="stylesheet" href="/omodos4/hotfix.css" data-safe-v4="2">\n</head>',1)
              s=s.replace("</body>",'<!-- '+marker+' --><script src="/omodos4/hotfix.js" defer></script>\n</body>',1)
              p.write_text(s,encoding="utf-8")
          assert s.count(marker)==1
          assert s.count('/omodos4/hotfix.css')==1
          assert s.count('/omodos4/hotfix.js')==1
      - name: Static regression checks
        run: |
          node --check public/omodos4/hotfix.js
          test -s public/omodos4/hotfix.css
          grep -q 'setInterval(sync,3000)' public/omodos4/hotfix.js
          ! grep -q 'MutationObserver' public/omodos4/hotfix.js
          ! grep -q 'src/entry.js' wrangler.jsonc
      - name: Persist patched frontend on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: attach safe frontend-only OMODOS4 recovery"
            git push
          fi
      - name: Install and dry-run stable Worker
        run: |
          npm install
          npx wrangler deploy --dry-run --outdir /tmp/omodos-safe
      - name: Deploy frontend with unchanged backend
        run: npx wrangler deploy
      - name: Production smoke
        run: |
          for i in $(seq 1 20); do
            ROOT="$(curl -fsS https://omodos.offsetbmj.workers.dev/ || true)"
            API="$(curl -fsS -X POST -H 'content-type: application/json' --data '{"action":"login","username":"__smoke_invalid__","password":"__smoke_invalid__"}' https://omodos.offsetbmj.workers.dev/api || true)"
            JS="$(curl -fsS https://omodos.offsetbmj.workers.dev/omodos4/hotfix.js || true)"
            if printf '%s' "$ROOT" | grep -q 'OMODOS4_FRONTEND_SAFE_V2' && printf '%s' "$ROOT" | grep -q 'Masukkan username' && printf '%s' "$API" | grep -q 'Username atau password salah' && printf '%s' "$JS" | grep -q 'frontend-only recovery'; then exit 0; fi
            sleep 3
          done
          exit 1
