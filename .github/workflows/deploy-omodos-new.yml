name: Deploy OMODOS production (new Cloudflare account)
on:
  push:
    branches:
      - main
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/deploy-omodos-new.yml"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
  workflow_dispatch:
concurrency:
  group: omodos-new-account-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_NEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and target credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check src/worker.js
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/omodos-new-dry-run
      - name: Deploy updated Worker and assets
        run: |
          set -euo pipefail
          npx wrangler deploy
