name: Deploy OMODOS to new Cloudflare account
on:
  push:
    branches:
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/deploy-omodos-new.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_NEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and target credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check src/worker.js
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/omodos-new-dry-run
      - name: Deploy updated Worker and assets
        run: |
          set -euo pipefail
          npx wrangler deploy
      - name: Confirm importer asset and protected setup
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/omodos-import-page -w '%{http_code}' https://omodos.juldigi.workers.dev/migration.html)"
            test "$code" = "200" && break
            sleep 3
          done
          test "$code" = "200"
          grep -q 'Impor OMODOS' /tmp/omodos-import-page
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"name":"probe","rows":[]}' https://omodos.juldigi.workers.dev/api/setup/import)"
          test "$status" = "403"
          echo "Migration page is available and unsigned imports are blocked."
