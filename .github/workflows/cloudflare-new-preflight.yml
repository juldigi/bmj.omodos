name: OMODOS new Cloudflare account preflight
on:
  push:
    branches:
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/cloudflare-new-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_NEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_NEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check required secrets without exposing values
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_NEW_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_NEW_ACCOUNT_ID"; exit 1; }
          echo "New-account secrets are present."
      - name: Verify token and account access
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4"
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def check(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Cloudflare API denied access (HTTP {exc.code})") from None
              if not data.get("success"):
                  raise SystemExit("Cloudflare API verification failed.")
              return data.get("result")
          check("/accounts/" + account + "/tokens/verify")
          check("/accounts/" + account + "/workers/scripts")
          print("Token is valid and can list Workers in the target account.")
          PY
      - name: Validate source without deploying
        run: |
          node --check src/worker.js
          node --check src/entry.js
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/omodos-new-account-dry-run
          echo "Dry run passed; no Worker was deployed and no database was changed."
