name: Audit OMODOS Recovered Frontend

on:
  push:
    paths:
      - "public/index.html"
      - ".github/workflows/audit-recovered-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static audit recovered production frontend
        shell: python
        run: |
          from pathlib import Path
          import hashlib, datetime

          path = Path("public/index.html")
          raw = path.read_bytes()
          text = raw.decode("utf-8", errors="replace")
          lines = text.splitlines()

          groups = {
              "Dollar helper definitions": [
                  "const $ =", "const $=", "let $ =", "let $=",
                  "var $ =", "var $=", "function $(", "window.$ ="
              ],
              "Potential jQuery-like chained calls": [
                  ").forEach(", ").find(", ").map(", ").filter("
              ],
              "Known regression functions": [
                  "attachSparepartPaginationHandlers",
                  "renderSparepartCollectTable",
                  "applySparepartFilters",
                  "switchToView"
              ],
              "OMODOS 4 RBAC": [
                  "omodos4.view", "OMODOS 4.0", "Superadmin"
              ],
              "Copilot & Bantuan": [
                  "Copilot", "Bantuan"
              ],
              "Machine status": [
                  "machineStatus", "statusMachine", "status mesin",
                  "latestLogbook", "latestPatrol", "latest logbook", "latest patrol"
              ],
              "Pagination controls": [
                  "pageSize", "Halaman Sebelumnya", "Halaman Selanjutnya",
                  "Halaman Awal", "Halaman Akhir"
              ],
          }

          def literal_matches(term):
              low = term.lower()
              return [(i, line) for i, line in enumerate(lines, 1) if low in line.lower()]

          out = [
              "# OMODOS Recovered Frontend — Static Audit",
              "",
              f"- Audited UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"- File bytes: {len(raw)}",
              f"- Lines: {len(lines)}",
              f"- SHA-256: {hashlib.sha256(raw).hexdigest()}",
              ""
          ]

          for title, terms in groups.items():
              out.append("## " + title)
              seen = set()
              count = 0
              for term in terms:
                  ms = literal_matches(term)
                  count += len(ms)
                  if not ms:
                      continue
                  out.append(f"### {term} — {len(ms)} match(es)")
                  for i, line in ms[:50]:
                      key = (i, line)
                      if key in seen:
                          continue
                      seen.add(key)
                      compact = line.strip()
                      if len(compact) > 700:
                          compact = compact[:700] + "…"
                      out.append(f"- L{i}: {compact}")
              if count == 0:
                  out.append("- No matches.")
              out.append("")

          risky = []
          for i, line in enumerate(lines, 1):
              compact = "".join(line.split())
              if "$(" in compact and (
                  ").forEach(" in compact or ").find(" in compact
              ):
                  risky.append((i, line.strip()))

          dollar_defs = []
          for i, line in enumerate(lines, 1):
              compact = "".join(line.split())
              if any(x in compact for x in (
                  "const$=", "let$=", "var$=", "function$(", "window.$="
              )):
                  dollar_defs.append((i, line.strip()))

          out.append("## Regression risk summary")
          if risky:
              out.append(f"- HIGH: found {len(risky)} direct dollar-helper .forEach/.find call(s).")
              for i, line in risky[:80]:
                  out.append(f"  - L{i}: {line[:700]}")
          else:
              out.append("- No direct dollar-helper .forEach or .find pattern found.")
          if dollar_defs:
              out.append("- Dollar helper candidates:")
              for i, line in dollar_defs[:30]:
                  out.append(f"  - L{i}: {line[:700]}")
          out.append("")

          Path("audit").mkdir(exist_ok=True)
          Path("audit/RECOVERED_FRONTEND_STATIC_AUDIT.md").write_text(
              "\n".join(out) + "\n", encoding="utf-8"
          )

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/RECOVERED_FRONTEND_STATIC_AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit change."
            exit 0
          fi
          git commit -m "audit: inspect recovered OMODOS production frontend"
          git push
