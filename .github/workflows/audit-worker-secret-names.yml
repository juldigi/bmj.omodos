name: Audit Worker Secret Names

on:
  push:
    branches:
      - deploy/worker-frontend-sync
    paths:
      - ".github/workflows/audit-worker-secret-names.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3c0bf44ff86c9587390f09b6d0bc42dd

    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save wrangler@latest
      - name: List secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name omodos --format json > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("/tmp/secrets.json").read_text() or "[]")
          safe=[{"name":x.get("name"),"type":x.get("type")} for x in rows if isinstance(x,dict)]
          report=["# OMODOS Worker Secret Names",""]
          for x in safe:
            report.append(f"- {x['name']} — {x['type']}")
          required={"GEMINI_API_KEY","GROQ_API_KEY","SETUP_TOKEN"}
          names={str(x.get("name")) for x in safe}
          report += ["",f"- Required present: {sorted(required & names)}",f"- Required missing: {sorted(required - names)}"]
          Path("audit").mkdir(exist_ok=True)
          Path("audit/WORKER_SECRET_NAMES.md").write_text("\n".join(report)+"\n")
          print("[SECRET_AUDIT] required_present="+str(sorted(required & names)))
          print("[SECRET_AUDIT] required_missing="+str(sorted(required - names)))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/WORKER_SECRET_NAMES.md
          git commit -m "audit: inspect Worker secret names" || true
          git push
