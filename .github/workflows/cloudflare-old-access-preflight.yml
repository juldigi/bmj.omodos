name: OMODOS old account access preflight
on:
  push:
    branches:
      - migration/cloudflare-new-preflight
    paths:
      - ".github/workflows/cloudflare-old-access-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OLD_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      OLD_ACCOUNT: 3c0bf44ff86c9587390f09b6d0bc42dd
    steps:
      - name: Verify existing token can read old Worker
        run: |
          test -n "$OLD_TOKEN" || { echo "Old deployment token unavailable"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["OLD_ACCOUNT"] + "/workers/scripts"
          req = urllib.request.Request(url, headers={"Authorization":"Bearer " + os.environ["OLD_TOKEN"]})
          try:
              with urllib.request.urlopen(req, timeout=20) as response: data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Old Worker access denied (HTTP {exc.code})") from None
          if not data.get("success"): raise SystemExit("Old Worker access not verified")
          scripts = data.get("result") or []
          if not any(s.get("id") == "omodos" for s in scripts):
              raise SystemExit("OMODOS Worker not present in accessible account")
          print("Existing token can access old OMODOS Worker. No deployment or data export occurred.")
          PY
