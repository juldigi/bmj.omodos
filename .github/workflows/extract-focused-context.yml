name: Extract OMODOS Focused Code Context

on:
  push:
    paths:
      - ".github/workflows/extract-focused-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract focused function context
        shell: python
        run: |
          from pathlib import Path

          src = Path("public/index.html").read_text(encoding="utf-8", errors="replace")
          lines = src.splitlines()

          needles = [
              "function switchToView(",
              "function attachSparepartPaginationHandlers(",
              "function renderSparepartCollectTable(",
              "function applySparepartFilters(",
              "const $ = (sel",
              "const $$ =",
              "function latestLogbookForMachine_",
              "function latestPatrolForMachine_",
              "function currentMachineStatusSnapshot_",
              "omodos4.view",
              "Bantuan",
              "copilot-data-record",
              "copilot-external-card",
              "copilot-result-group",
              "aiInternetResearch",
              "function renderCopilot",
              "function openCopilot",
              "copilot-record-title",
              "data-copilot",
              "function copilotSearchInternal_(",
              "function copilotCompactFields_(",
              "function copilotRowLabel_(",
              "function copilotInternalAnswer_(",
              "function copilotRowCardHtml_(",
              "Deskripsi Pekerjaan",
              "Nama Material",
              "Jumlah Material",
              "Satuan",
              "editLogbook",
              "logbook-edit",
              "materialSelect",
              "addLogbookMaterial",
              "function renderLogbook",
              "function openEditLogbook",
              "function saveLogbook",
              "location.reload",
              "screen.orientation",
              "orientationchange",
              "window.onresize",
              "sparepart-rows",
              "btn-add-sparepart-row",
              "form-logbook",
              "EDITING_ENTRY",
              "edit-entry",
              "renderEntries",
              "populateSparepart",
              "function addSparepart",
              "function renderSparepartRows",
              "data-sparepart",
              "select[name=\"material\"]",
              "sparepartSelect",
              "function renderLogbookTable",
              "function syncSparepartRowsFromDom",
              "function handleSparepartLookupInput_(",
              "function renderSparepartSuggestBox_(",
              "function renderEntryEditForm(",
              "data-edit-field",
              "updateEntry",
              "btn-save-entry-edit",
              "SPAREPART_ROWS.map",
              "sparepartData",
              "function submitEntry",
              "form-entry",
              "const rows = SPAREPART_ROWS",
              "Jumlah sparepart baris",
              "sparePart:",
              "sparePartDigunakan",
              "namaMaterial:",
              "materialNumberSAP:",
              "formData.get(\"deskripsiMasalah\")",
              "new FormData(formEntryForDraft)",
              "const payload ="
          ]

          out = ["# OMODOS Focused Code Context", ""]
          for needle in needles:
              hits = [i for i,line in enumerate(lines) if needle.lower() in line.lower()]
              out.append("## " + needle)
              if not hits:
                  out.append("No match.")
                  out.append("")
                  continue
              for idx in hits[:10]:
                  start=max(0,idx-12)
                  end=min(len(lines),idx+65)
                  out.append(f"### Around line {idx+1}")
                  out.append("~~~text")
                  for j in range(start,end):
                      out.append(f"{j+1:05d}: {lines[j]}")
                  out.append("~~~")
                  out.append("")

          Path("audit").mkdir(exist_ok=True)
          Path("audit/FOCUSED_CODE_CONTEXT.md").write_text("\n".join(out)+"\n", encoding="utf-8")

      - name: Commit context report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/FOCUSED_CODE_CONTEXT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: extract focused OMODOS code context"
          git push
