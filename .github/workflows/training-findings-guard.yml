name: Training Findings Guard
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/worker.js
      - run: node tools/test_training_findings.cjs
      - run: node tools/test_offset_ways.cjs
