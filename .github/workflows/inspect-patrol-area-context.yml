name: Inspect Patrol and Logbook UI anchors

on:
  push:
    paths:
      - ".github/workflows/inspect-patrol-area-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source contexts for requested changes
        shell: python
        run: |
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          terms = [
            "select-kategoriArea", "OMODOS_WORK_AREAS", "Pilih kategori",
            "savePredictiveReport", "report.findings", "Warning", "Abnormal",
            "tambahkan ke daftar temuan", "addFinding", "finding.files",
            "capture=", "type=\"file\"", "PATROL_STATE", "Patrol"
          ]
          out = ["# Exact Patrol / Logbook UI source contexts", ""]
          for term in terms:
            out.append("## " + term)
            starts, pos = [], 0
            while len(starts) < 12:
              i = s.lower().find(term.lower(), pos)
              if i < 0: break
              starts.append(i); pos = i + len(term)
            out.append("Matches: " + str(len(starts)))
            for n, i in enumerate(starts, 1):
              out.append("### Match " + str(n) + " at byte " + str(i))
              out.append("```javascript")
              out.append(s[max(0, i-700):min(len(s), i+1500)])
              out.append("```")
            out.append("")
          Path("audit").mkdir(exist_ok=True)
          Path("audit/PATROL_AREA_SOURCE_CONTEXTS.md").write_text("\n".join(out), encoding="utf-8")
      - name: Commit source context report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/PATROL_AREA_SOURCE_CONTEXTS.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: extract Patrol and Logbook UI anchors"
          git push origin HEAD:main
