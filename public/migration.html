<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impor OMODOS</title>
<style>body{font:16px system-ui;max-width:680px;margin:3rem auto;padding:0 1.25rem}input,button{font:inherit;padding:.7rem;margin:.5rem 0}button{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Impor OMODOS</h1>
<p>Pilih paket migrasi lokal yang telah ditandatangani. Data dikirim langsung ke Worker OMODOS akun baru.</p>
<input id="package" type="file" accept=".json,application/json">
<button id="start" disabled>Mulai impor</button>
<pre id="status" role="status">Menunggu paket.</pre>
<script>
let operations=[], index=0, running=false;
const status=document.getElementById('status'), start=document.getElementById('start');
document.getElementById('package').addEventListener('change',async(event)=>{
  start.disabled=true; operations=[]; index=0;
  try {
    const file=event.target.files[0]; if(!file) return;
    const pack=JSON.parse(await file.text());
    if(pack.origin!==location.origin || !Array.isArray(pack.operations) ||
       pack.operations.length<3 || pack.operations.at(-1).path!=='/api/setup/finish') throw Error('Paket tidak cocok dengan Worker ini.');
    operations=pack.operations;
    status.textContent='Siap: '+pack.sheetCount+' tabel, '+pack.fileCount+' lampiran, '+operations.length+' langkah.';
    start.disabled=false;
  } catch(e) {status.textContent='Paket tidak valid: '+e.message;}
});
start.addEventListener('click',async()=>{
  if(running||!operations.length)return;
  running=true;start.disabled=true;
  try {
    for(;index<operations.length;index++){
      const op=operations[index];
      const response=await fetch(op.path,{method:'POST',cache:'no-store',headers:{
        'Content-Type':'application/json',
        'X-Migration-Expiry':String(op.expiry),
        'X-Migration-Signature':op.signature
      },body:JSON.stringify(op.body)});
      const result=await response.json();
      if(!response.ok||!result.ok)throw Error('Langkah '+(index+1)+': '+(result.error||'HTTP '+response.status));
      status.textContent='Impor '+(index+1)+'/'+operations.length+' selesai.';
    }
    status.textContent='Impor selesai. Database, pengaturan, dan lampiran telah dipindahkan.';
  }catch(e){status.textContent='Terhenti pada '+(index+1)+'/'+operations.length+': '+e.message+' Pilih Mulai impor untuk mencoba lagi.';}
  finally{running=false;start.disabled=index>=operations.length;}
});
</script></html>
